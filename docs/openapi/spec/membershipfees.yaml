# Membership fees module — the API surface of MembershipFeeTypeController,
# FeeSelectionCampaignController, MembershipFeeGroupController, MemberFeeChoiceController and
# MemberFeeSummaryController (membershipfees module).
#
# MemberFeeChoice and MemberFeeSummary share the URL prefix /api/members/{memberId} with the
# members module — registered here by controller, not by URL prefix, per klabis-api-spec skill.
# Their parameter is named MembershipFeeMemberIdParam to avoid colliding with members.yaml's
# MemberIdParam — component names are one global namespace after bundling.
#
# getFeeGroup (MembershipFeeGroupController) declares x-hal-embedded: the group's members ride
# along in the response's _embedded block, assembled at runtime by HalResponseContext.embed. The
# deriver reads that marker to build the envelope; the generated Java returns the bare payload.
# Same precedent as events.yaml's getEvent.
#
# MemberFeeChoice and MemberFeeSummary operations: getChoice, getFeeSummary and getFeeHistory
# admit MEMBERS:MANAGE and MEMBERS:SELECT_MEMBERSHIP_FEE_TYPE held over the member. chooseFeeType
# and removeChoice admit only MEMBERS:SELECT_MEMBERSHIP_FEE_TYPE: MEMBERS:MANAGE is deliberately
# not an alternative, so administrators cannot choose on a member's behalf. The grant is
# SPECIFIC-only: an adult member holds it over themself, a legal guardian over their minors; a
# minor holds it over nobody.
#
# Standalone OpenAPI document: this file renders on its own in Swagger UI / Redoc, served
# from this directory so its ./_shared/*.yaml refs resolve. info is duplicated from
# klabis.yaml rather than shared, because $ref cannot target a document's own info; the
# bundler ignores both keys (modules are pulled in by #/paths/... pointer, never whole-file)
# and validate.mjs pins version to the root's so the two cannot drift.
openapi: 3.1.0

info:
  title: Klabis API — Membership fees module
  description: The Membership fees slice of the Klabis API. See klabis.yaml for the full API.
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://api.klabis.com
    description: Production server

paths:

  /api/membership-fee-types:
    get:
      operationId: listFeeTypes
      tags: [MembershipFeeTypes]
      summary: List all membership fee types
      description: Returns all membership fee types in the catalog.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller. The activeCampaign/
      # pastCampaigns links and the createFeeType/publishYear affordances are only added for callers
      # with MEMBERS:MANAGE, but that is decided inline in the controller (isAdmin()) rather than
      # gating the whole operation.
      responses:
        '200':
          description: List of membership fee types retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFeeTypeSummaryResponse'
          x-hal-links:
            self:
              description: This collection
            activeCampaign:
              operation: getPublication
              description: Present only for callers with MEMBERS:MANAGE, when a campaign is active
            pastCampaigns:
              operation: listPublications
              description: Present only for callers with MEMBERS:MANAGE
          x-hal-templates:
            createFeeType:
              operation: createFeeType
              description: Present only for callers with MEMBERS:MANAGE
            publishYear:
              operation: publishYear
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: createFeeType
      tags: [MembershipFeeTypes]
      summary: Create a membership fee type
      description: Creates a new membership fee type in the catalog.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMembershipFeeTypeRequest'
      responses:
        '201':
          description: Membership fee type created
          headers:
            Location:
              description: URI of the created type
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/membership-fee-types/{id}:
    get:
      operationId: getFeeType
      tags: [MembershipFeeTypes]
      summary: Get membership fee type details
      description: Returns a single membership fee type by ID.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller. editFeeType/deleteFeeType
      # affordances still require MEMBERS:MANAGE via klabisAfford's own authorization check.
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
      responses:
        '200':
          description: Membership fee type found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipFeeTypeResponse'
          x-hal-links:
            self:
              description: This type
            collection:
              operation: listFeeTypes
              description: Back to the type list
            rules:
              operation: listRules
              description: Payment rules for this type
          x-hal-templates:
            editFeeType:
              operation: editFeeType
              description: Present only for callers with MEMBERS:MANAGE
            deleteFeeType:
              operation: deleteFeeType
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    patch:
      operationId: editFeeType
      tags: [MembershipFeeTypes]
      summary: Edit a membership fee type
      description: |
        Partial update of a type's name, yearly fee and/or payment rules. Fields omitted from the
        request are left unchanged.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMembershipFeeTypeRequest'
      responses:
        '204':
          description: Membership fee type updated
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteFeeType
      tags: [MembershipFeeTypes]
      summary: Delete a membership fee type
      description: Deletes a membership fee type from the catalog.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
      responses:
        '204':
          description: Membership fee type deleted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/membership-fee-types/{id}/rules:
    get:
      operationId: listRules
      tags: [MembershipFeeTypes]
      summary: List payment rules for a membership fee type
      description: Returns all payment rules defined on a type.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller. addRule affordance still
      # requires MEMBERS:MANAGE via klabisAfford's own authorization check.
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
      responses:
        '200':
          description: List of payment rules retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentRuleResponse'
          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            addRule:
              operation: addRule
              description: Present only for callers with MEMBERS:MANAGE
          x-hal-item-links:
            self:
              operation: getRule
              description: This payment rule
            eventType:
              operation: getEventType
              description: The event type the rule applies to
          x-hal-item-templates:
            editRule:
              operation: editRule
              description: Present only for callers with MEMBERS:MANAGE. The ruleType property carries its options inline.
            removeRule:
              operation: removeRule
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: addRule
      tags: [MembershipFeeTypes]
      summary: Add a payment rule to a membership fee type
      description: |
        Adds a new payment rule (percentage or fixed amount) for an event type/ranking combination.
        Returns Location header pointing to the created rule.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPaymentRuleRequest'
      responses:
        '201':
          description: Payment rule created
          headers:
            Location:
              description: URI of the created rule
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/membership-fee-types/{id}/rules/{eventTypeId}/{ranking}:
    get:
      operationId: getRule
      tags: [MembershipFeeTypes]
      summary: Get a payment rule detail from a membership fee type
      description: Returns a single payment rule identified by event type and ranking.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller. editRule/removeRule
      # affordances still require MEMBERS:MANAGE via klabisAfford's own authorization check.
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
        - $ref: '#/components/parameters/RuleEventTypeIdParam'
        - $ref: '#/components/parameters/RuleRankingParam'
      responses:
        '200':
          description: Payment rule found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRuleResponse'
          x-hal-links:
            self:
              description: This payment rule
            eventType:
              description: The event type this rule applies to
          x-hal-templates:
            editRule:
              operation: editRule
              description: Present only for callers with MEMBERS:MANAGE
            removeRule:
              operation: removeRule
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    patch:
      operationId: editRule
      tags: [MembershipFeeTypes]
      summary: Edit a payment rule's value on a membership fee type
      description: Updates the rule type and value (percentage or fixed amount) of an existing rule.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
        - $ref: '#/components/parameters/RuleEventTypeIdParam'
        - $ref: '#/components/parameters/RuleRankingParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPaymentRuleRequest'
      responses:
        '204':
          description: Payment rule updated
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    delete:
      operationId: removeRule
      tags: [MembershipFeeTypes]
      summary: Remove a payment rule from a membership fee type
      description: Removes a payment rule identified by event type and ranking.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/TypeIdParam'
        - $ref: '#/components/parameters/RuleEventTypeIdParam'
        - $ref: '#/components/parameters/RuleRankingParam'
      responses:
        '204':
          description: Payment rule removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/fee-selection-campaigns:
    get:
      operationId: listPublications
      tags: [FeeSelectionCampaigns]
      summary: List fee year publications, optionally filtered by status
      description: |
        Lists fee selection campaigns (one per calendar year). status=closed returns only past
        campaigns; omitted returns all.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller. publishYear affordance still
      # requires MEMBERS:MANAGE via klabisAfford's own authorization check.
      parameters:
        - name: status
          in: query
          description: 'Filter by status: ''closed'' returns only past campaigns'
          required: false
          schema:
            # Plain string, not enum: an inline `enum:` on a property/parameter that IS generated
            # into Java (request DTOs, query params) produces a reference to a synthetic
            # "<Schema><Property>" (or named-schema) enum class, but this generator version emits
            # an EMPTY body for a bare top-level enum schema used only as a query-param type — the
            # file compiles to nothing and every reference fails "cannot find symbol". No existing
            # domain enum exists to map onto either (see events.yaml's EventStatus precedent, which
            # works because it maps onto a real domain enum). Plain string preserves the actual
            # wire format; CampaignStatusFilter.valueOf() in the controller already validates it.
            type: string
      responses:
        '200':
          description: List of fee year publications retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeeSelectionCampaignResponse'
          x-hal-links:
            self:
              description: This collection, with the current status filter
          x-hal-templates:
            publishYear:
              operation: publishYear
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: publishYear
      tags: [FeeSelectionCampaigns]
      summary: Publish fee levels for a calendar year
      description: |
        Opens a fee selection campaign for a calendar year, publishing a snapshot of the given
        membership fee types as fee groups members can choose from.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishYearRequest'
      responses:
        '201':
          description: Fee year publication created
          headers:
            Location:
              description: URI of the created publication
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/fee-selection-campaigns/{id}:
    get:
      operationId: getPublication
      tags: [FeeSelectionCampaigns]
      summary: Get fee year publication details
      description: Returns a single fee selection campaign by ID.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller. changeDeadline/closeCampaign
      # affordances still require MEMBERS:MANAGE via klabisAfford's own authorization check, and are
      # additionally state-gated (not closed / not processed) in the postprocessor.
      parameters:
        - $ref: '#/components/parameters/CampaignIdParam'
      responses:
        '200':
          description: Fee year publication found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeSelectionCampaignResponse'
          x-hal-links:
            self:
              description: This publication
            collection:
              operation: listPublications
              description: Back to the publication list
            levels:
              operation: listGroupsForYear
              description: Fee groups published for this campaign's year
          x-hal-templates:
            changeDeadline:
              operation: changeDeadline
              description: Present for callers with MEMBERS:MANAGE, while the campaign is not closed
            closeCampaign:
              operation: closeCampaign
              description: |
                Present for callers with MEMBERS:MANAGE, while the campaign is not closed and not
                yet processed
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/fee-selection-campaigns/{id}/deadline:
    patch:
      operationId: changeDeadline
      tags: [FeeSelectionCampaigns]
      summary: Change voting deadline of an active campaign
      description: Updates the voting deadline of a campaign that is not yet closed.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/CampaignIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDeadlineRequest'
      responses:
        '200':
          description: Voting deadline updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeSelectionCampaignResponse'
          x-hal-links:
            self:
              description: This publication
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/fee-selection-campaigns/{id}/close:
    post:
      operationId: closeCampaign
      tags: [FeeSelectionCampaigns]
      summary: Manually close a campaign
      description: |
        Processes a campaign immediately, regardless of its voting deadline — finalising member
        assignments to fee groups for the campaign's year.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/CampaignIdParam'
      responses:
        '204':
          description: Campaign closed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/fee-selection-campaigns/{year}/groups:
    get:
      operationId: listGroupsForYear
      tags: [FeeSelectionCampaigns]
      summary: List published fee groups for a given year
      description: Returns the fee groups published as part of the campaign for the given year.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller.
      parameters:
        - $ref: '#/components/parameters/CampaignYearParam'
      responses:
        '200':
          description: List of fee groups retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFeeGroupResponse'
          x-hal-links:
            self:
              description: This collection, for the given year
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/membership-fee-groups/{id}:
    # getFeeGroup returns the plain MembershipFeeGroupResponse payload. The group-members collection is
    # declared by the controller via HalResponseContext.embed(...) and rendered under _embedded
    # by HalResponseBodyAdvice — the same deferred-assembly path as _links and _templates, so it
    # stays out of the generated return type — same as events.yaml's getEvent.
    # Note the _embedded key below is "members" per MembershipFeeGroupResponse's
    # @Relation(collectionRelation = "members") — NOT the class-name-derived default.
    get:
      operationId: getFeeGroup
      tags: [MembershipFeeGroups]
      summary: Get membership fee group details with snapshot and member count
      description: |
        Returns a published fee group's snapshot (yearly fee, payment rules) and its members,
        embedded under "members".
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller. assignMember/editSnapshot
      # affordances still require MEMBERS:MANAGE via klabisAfford's own authorization check.
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '200':
          description: Membership fee group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipFeeGroupResponse'
          # The group's members ride along in _embedded, assembled at runtime by
          # HalResponseContext.embed (MembershipFeeGroupController). The suffix keeps this envelope
          # distinct from the plain EntityModelMembershipFeeGroupResponse that listGroupsForYear
          # derives for the same payload.
          x-hal-embedded:
            items: MemberInGroupResponse
            suffix: WithMembers
          x-hal-links:
            self:
              description: This fee group
            rules:
              operation: listGroupRules
              description: Payment rules snapshot for this group
            sourceType:
              operation: getFeeType
              description: The membership fee type this group's snapshot was published from
          x-hal-templates:
            editSnapshot:
              operation: editSnapshot
              description: Present for callers with MEMBERS:MANAGE, only while the group is EDITABLE
            assignMember:
              operation: assignMember
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    patch:
      operationId: editSnapshot
      tags: [MembershipFeeGroups]
      summary: Edit yearly fee and payment rules of a published level
      description: |
        Updates the yearly fee amount and/or payment rules snapshot of a published fee group. Only
        allowed while the group's status is EDITABLE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditGroupSnapshotRequest'
      responses:
        '204':
          description: Fee group snapshot updated
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/membership-fee-groups/{id}/rules:
    get:
      operationId: listGroupRules
      tags: [MembershipFeeGroups]
      summary: List payment rules snapshot for a membership fee group
      description: Returns the payment rules snapshot published for this fee group.
      security:
        - KlabisAuth: [MEMBERS]
      # No x-klabis-authority: readable by any authenticated caller.
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '200':
          description: List of payment rules retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentRuleResponse'
          x-hal-links:
            self:
              description: This collection
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/membership-fee-groups/{groupId}/members:
    post:
      operationId: assignMember
      tags: [MembershipFeeGroups]
      summary: Assign a member to a fee group
      description: |
        Admin emergency assignment: adds a member directly to a published fee group for a given
        year, bypassing the normal self-service choice flow.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingAdmin'
      parameters:
        - $ref: '#/components/parameters/GroupIdPathParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAssignMemberRequest'
      responses:
        '204':
          description: Member assigned to fee group
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/{memberId}/fee-choice/{year}:
    get:
      operationId: getChoice
      tags: [MemberFeeChoice]
      summary: Get member's current fee level choice for a year
      description: |
        Returns the member's current fee group choice and the recommended type for the year, if
        any.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_SELECT_MEMBERSHIP_FEE_TYPE]
      parameters:
        - $ref: '#/components/parameters/FeeChoiceMemberIdParam'
        - $ref: '#/components/parameters/FeeChoiceYearParam'
      responses:
        '200':
          description: Fee level choice retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberFeeChoiceResponse'
          x-hal-links:
            self:
              description: This fee choice
            currentGroup:
              operation: getFeeGroup
              description: Present when the member has a current fee group choice
            recommendedType:
              operation: getFeeType
              description: Present when a recommended type exists for this year
          x-hal-templates:
            chooseFeeType:
              operation: chooseFeeType
              description: Choose a fee level for this year
            removeChoice:
              operation: removeChoice
              description: Remove the fee level choice for this year
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - only the member, a MEMBERS:MANAGE holder or a legal guardian of the member can access the fee level choice
          content:
            application/problem+json:
              schema:
                $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: chooseFeeType
      tags: [MemberFeeChoice]
      summary: Choose a fee level for a year
      description: Records the member's chosen fee group for the given year.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: [MEMBERS_SELECT_MEMBERSHIP_FEE_TYPE]
      parameters:
        - $ref: '#/components/parameters/FeeChoiceMemberIdParam'
        - $ref: '#/components/parameters/FeeChoiceYearParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChooseFeeChoiceRequest'
      responses:
        '204':
          description: Fee level choice recorded
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - only the member or a legal guardian of the member can manage the fee level choice
          content:
            application/problem+json:
              schema:
                $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    delete:
      operationId: removeChoice
      tags: [MemberFeeChoice]
      summary: Remove fee level choice for a year
      description: Removes the member's chosen fee group for the given year.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: [MEMBERS_SELECT_MEMBERSHIP_FEE_TYPE]
      parameters:
        - $ref: '#/components/parameters/FeeChoiceMemberIdParam'
        - $ref: '#/components/parameters/FeeChoiceYearParam'
      responses:
        '204':
          description: Fee level choice removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - only the member or a legal guardian of the member can manage the fee level choice
          content:
            application/problem+json:
              schema:
                $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/{memberId}/fee-summary:
    get:
      operationId: getFeeSummary
      tags: [MemberFeeSummary]
      summary: Get member's fee type summary for the active campaign
      description: |
        Returns the member's current fee group (if assigned), the recommended type, and whether
        voting is currently open, for the year of the active campaign. Answers 404 when no campaign is active.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_SELECT_MEMBERSHIP_FEE_TYPE]
      parameters:
        - $ref: '#/components/parameters/FeeSummaryMemberIdParam'
      responses:
        '200':
          description: Fee level summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberFeeSummaryResponse'
          x-hal-links:
            self:
              description: This fee summary
            group:
              operation: getFeeGroup
              description: Present when the member has a current fee group
          x-hal-templates:
            chooseFeeType:
              operation: chooseFeeType
              description: Present only while voting is open for this year
            removeChoice:
              operation: removeChoice
              description: Present only while voting is open and the member has a current choice
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - only the member, a MEMBERS:MANAGE holder or a legal guardian of the member can access the fee summary
          content:
            application/problem+json:
              schema:
                $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/{memberId}/fee-history:
    get:
      operationId: getFeeHistory
      tags: [MemberFeeSummary]
      summary: Get member's fee level assignment history
      description: Returns the full history of the member's fee group assignments across years.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_SELECT_MEMBERSHIP_FEE_TYPE]
      parameters:
        - $ref: '#/components/parameters/FeeSummaryMemberIdParam'
      responses:
        '200':
          description: Fee level history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberFeeHistoryResponse'
          x-hal-links:
            self:
              description: This fee history
            member:
              operation: getMember
              description: The member whose fee history this is
            feeSummary:
              operation: getFeeSummary
              description: Fee type summary of the active campaign; present only while a campaign is active and the caller may choose the fee type (the member or a legal guardian)
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - only the member themselves, a MEMBERS:MANAGE holder or a legal guardian of the member can access the fee history
          content:
            application/problem+json:
              schema:
                $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    KlabisAuth:
      type: oauth2
      description: OAuth2 authentication with Klabis Authorization Server
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: authenticate
            profile: display user profile information
            MEMBERS: Members
            EVENTS: Events
            SYNC: Synchronisation

  parameters:
    TypeIdParam:
      name: id
      in: path
      description: Membership fee type UUID
      required: true
      schema:
        type: string
        format: uuid

    RuleEventTypeIdParam:
      name: eventTypeId
      in: path
      description: Event type UUID
      required: true
      schema:
        type: string
        format: uuid

    RuleRankingParam:
      name: ranking
      in: path
      description: Ranking short name
      required: true
      schema:
        type: string

    CampaignIdParam:
      name: id
      in: path
      description: Fee selection campaign UUID
      required: true
      schema:
        type: string
        format: uuid

    CampaignYearParam:
      name: year
      in: path
      description: Calendar year
      required: true
      schema:
        type: integer
        format: int32

    GroupIdParam:
      name: id
      in: path
      description: Membership fee group UUID
      required: true
      schema:
        type: string
        format: uuid

    GroupIdPathParam:
      name: groupId
      in: path
      description: Membership fee group UUID
      required: true
      schema:
        type: string
        format: uuid

    # Prefixed to avoid colliding with members.yaml's MemberIdParam — component names are one
    # global namespace after bundling. See klabis-api-spec skill.
    FeeChoiceMemberIdParam:
      name: memberId
      in: path
      description: Member UUID
      required: true
      # Identifies the target member. Inert on its own: @TargetId is only consulted for a method
      # marked @OwnerVisible or guarded by an authority held over specific targets, so the
      # operations here that do neither are unaffected.
      x-klabis-target-id: MEMBER
      schema:
        type: string
        format: uuid

    FeeChoiceYearParam:
      name: year
      in: path
      description: Calendar year
      required: true
      schema:
        type: integer
        format: int32

    FeeSummaryMemberIdParam:
      name: memberId
      in: path
      description: Member UUID
      required: true
      # Identifies the target member. Inert on its own: @TargetId is only consulted for a method
      # marked @OwnerVisible or guarded by an authority held over specific targets, so the
      # operations here that do neither are unaffected.
      x-klabis-target-id: MEMBER
      schema:
        type: string
        format: uuid

  schemas:

    MembershipFeeTypeSummaryResponse:
      type: object
      description: Membership fee type summary for list views.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        yearlyFeeAmount:
          type: number
        yearlyFeeCurrency:
          type: string
        ruleCount:
          type: integer
          format: int32

    MembershipFeeTypeResponse:
      type: object
      description: Complete membership fee type information.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        yearlyFeeAmount:
          type: number
        yearlyFeeCurrency:
          type: string

    CreateMembershipFeeTypeRequest:
      type: object
      required: [name, yearlyFeeAmount]
      properties:
        name:
          type: string
          x-klabis-not-blank: true
        yearlyFeeAmount:
          type: number
          exclusiveMinimum: 0
        yearlyFeeCurrency:
          type: string
          description: Defaults to CZK when omitted.

    EditMembershipFeeTypeRequest:
      type: object
      description: |
        Partial update. Fields omitted from the request are left unchanged. When rules is
        provided, it replaces the type's entire rule set.
      properties:
        name:
          type: string
        yearlyFeeAmount:
          type: number
        yearlyFeeCurrency:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRuleRequest'

    PaymentRuleRequest:
      type: object
      required: [eventTypeId, rankingShortName, ruleType]
      properties:
        eventTypeId:
          type: string
          format: uuid
        rankingShortName:
          type: string
          x-klabis-not-blank: true
        ruleType:
          # Plain string, not enum — see the CampaignStatusFilterParam comment above for why; same
          # generator limitation, and no existing domain RuleType enum to map onto (the domain uses
          # a sealed RuleValue interface, not an enum). The domain's switch expression already
          # rejects unknown values.
          type: string
          x-klabis-not-blank: true
          x-hal-input-type: CoParticipationRuleType
        percent:
          type: integer
          format: int32
          description: Required when ruleType is PERCENTAGE.
        fixedAmount:
          type: number
          description: Required when ruleType is FIXED_AMOUNT.
        fixedCurrency:
          type: string
          description: Defaults to CZK when omitted.

    PaymentRuleResponse:
      type: object
      description: |
        A single payment rule. percentage is present when ruleType is PERCENTAGE; fixedAmount/
        fixedCurrency are present when ruleType is FIXED_AMOUNT.
      properties:
        eventTypeId:
          type: string
          format: uuid
        rankingShortName:
          type: string
        ruleType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
        percentage:
          type: integer
          format: int32
        fixedAmount:
          type: number
        fixedCurrency:
          type: string

    AddPaymentRuleRequest:
      type: object
      required: [eventTypeId, rankingShortName, ruleType]
      properties:
        eventTypeId:
          type: string
          format: uuid
        rankingShortName:
          type: string
          x-klabis-not-blank: true
        ruleType:
          type: string
          x-klabis-not-blank: true
          x-hal-input-type: CoParticipationRuleType
        percentage:
          type: integer
          format: int32
          description: Required when ruleType is PERCENTAGE.
        fixedAmount:
          type: number
          description: Required when ruleType is FIXED_AMOUNT.
        fixedCurrency:
          type: string
          description: Defaults to CZK when omitted.

    EditPaymentRuleRequest:
      type: object
      required: [ruleType]
      properties:
        ruleType:
          type: string
          x-klabis-not-blank: true
          x-hal-input-type: CoParticipationRuleType
        percentage:
          type: integer
          format: int32
          description: Required when ruleType is PERCENTAGE.
        fixedAmount:
          type: number
          description: Required when ruleType is FIXED_AMOUNT.
        fixedCurrency:
          type: string
          description: Defaults to CZK when omitted.

    FeeSelectionCampaignResponse:
      type: object
      description: A fee selection campaign for one calendar year.
      properties:
        id:
          type: string
          format: uuid
        year:
          type: integer
          format: int32
        votingDeadline:
          type: string
          format: date
        deadlineProcessedAt:
          type: string
          format: date-time

    PublishYearRequest:
      type: object
      required: [year, votingDeadline, typeIds]
      properties:
        year:
          type: integer
          format: int32
          exclusiveMinimum: 0
        votingDeadline:
          type: string
          format: date
        typeIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    ChangeDeadlineRequest:
      type: object
      required: [votingDeadline]
      properties:
        votingDeadline:
          type: string
          format: date

    MembershipFeeGroupResponse:
      type: object
      description: A published fee group — a snapshot taken from a type for one campaign year.
      properties:
        id:
          type: string
          format: uuid
        sourceTypeId:
          type: string
          format: uuid
        name:
          type: string
        year:
          type: integer
          format: int32
        yearlyFeeAmount:
          type: number
        yearlyFeeCurrency:
          type: string
        status:
          type: string
          enum: [EDITABLE, FROZEN]
        memberCount:
          type: integer
          format: int32
        rulesSnapshot:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRuleResponse'

    MemberInGroupResponse:
      type: object
      description: A member's assignment to a fee group.
      x-klabis-relation:
        collectionRelation: members
      properties:
        memberId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        registrationNumber:
          type: string
        joinedAt:
          type: string
          format: date
        source:
          type: string
          enum: [MEMBER_CHOICE, ADMIN_ASSIGNMENT]

    EditGroupSnapshotRequest:
      type: object
      required: [yearlyFeeAmount]
      properties:
        yearlyFeeAmount:
          type: number
          exclusiveMinimum: 0
        yearlyFeeCurrency:
          type: string
          description: Defaults to CZK when omitted.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRuleRequest'

    AdminAssignMemberRequest:
      type: object
      required: [memberId, year]
      properties:
        memberId:
          type: string
          format: uuid
          x-hal-input-type: MemberId
        year:
          type: integer
          format: int32

    MemberFeeChoiceResponse:
      type: object
      description: A member's fee level choice for a given year.
      properties:
        memberId:
          type: string
          format: uuid
        year:
          type: integer
          format: int32
        currentGroupId:
          type: string
          format: uuid
        recommendedTypeId:
          type: string
          format: uuid

    ChooseFeeChoiceRequest:
      type: object
      required: [membershipFeeGroupId]
      properties:
        membershipFeeGroupId:
          type: string
          format: uuid
          x-hal-input-type: MembershipFeeGroupChoice

    MemberFeeSummaryResponse:
      type: object
      description: A member's fee type summary for the active campaign year.
      properties:
        year:
          type: integer
          format: int32
          description: Year of the active campaign this summary refers to
        currentGroup:
          $ref: '#/components/schemas/CurrentGroupResponse'
        votingOpen:
          type: boolean
        recommendedGroupId:
          description: >-
            Published group of the summary year derived from the member's type of the previous year;
            matches the chooseFeeType options. Unlike MemberFeeChoiceResponse.recommendedTypeId, which is a catalog type id.
          type: string
          format: uuid

    CurrentGroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        yearlyFee:
          type: number

    MemberFeeHistoryResponse:
      type: object
      description: A member's full fee group assignment history across years.
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/FeeAssignmentResponse'

    FeeAssignmentResponse:
      type: object
      properties:
        year:
          type: integer
          format: int32
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        yearlyFee:
          type: number
          description: Yearly fee of the published group (snapshot), so it does not change with later catalog edits.
        joinedAt:
          type: string
          format: date
        source:
          type: string
          enum: [MEMBER_CHOICE, ADMIN_ASSIGNMENT]
