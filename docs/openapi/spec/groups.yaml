components:

  parameters:
    FamilyGroupIdParam:
      name: id
      in: path
      required: true
      description: Family group UUID
      schema:
        type: string
        format: uuid

    FreeGroupIdParam:
      name: id
      in: path
      required: true
      description: Group UUID
      schema:
        type: string
        format: uuid

    InvitationIdParam:
      name: invitationId
      in: path
      required: true
      description: Invitation UUID
      schema:
        type: string
        format: uuid

    TrainingGroupIdParam:
      name: id
      in: path
      required: true
      description: Training group UUID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request - invalid argument
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict - concurrent update (optimistic locking failure)
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Unprocessable entity - request violates a business rule
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'

  schemas:

    # === FamilyGroups ============================================================================

    CreateFamilyGroupRequest:
      type: object
      required: [name, parent]
      properties:
        name:
          type: string
          minLength: 1
        parent:
          type: string
          format: uuid

    AddMemberRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    CollectionModelEntityModelFamilyGroupSummaryResponse:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            familyGroupSummaryResponseList:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelFamilyGroupSummaryResponse'
        _links:
          $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelFamilyGroupSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/FamilyGroupSummaryResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    FamilyGroupSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberCount:
          type: integer
          format: int32

    # EntityModelFamilyGroupResponse documents the actual wire shape returned by the hand-written
    # getFamilyGroup — FamilyGroupResponse's properties (parents/members are themselves arrays of
    # HAL-wrapped items, each carrying its own _links) plus the envelope's own _links/_templates —
    # but is not referenced by any schemaMappings entry: getFamilyGroup is excluded from generation
    # (see the comment on that operation above and the module header comment).
    EntityModelFamilyGroupResponse:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            parents:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelParentResponse'
            members:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelFamilyGroupMembershipResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'
            _templates:
              $ref: './_shared/hal.yaml#/components/schemas/HalFormsTemplates'

    EntityModelParentResponse:
      allOf:
        - type: object
          properties:
            memberId:
              type: string
              format: uuid
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelFamilyGroupMembershipResponse:
      allOf:
        - type: object
          properties:
            memberId:
              type: string
              format: uuid
            joinedAt:
              type: string
              format: date-time
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    # === Groups (FreeGroup) ======================================================================

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    RenameGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    AddOwnerRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    InviteMemberRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    CancelInvitationRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    CollectionModelEntityModelGroupSummaryResponse:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            groupSummaryResponseList:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelGroupSummaryResponse'
        _links:
          $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelGroupSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/GroupSummaryResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    GroupSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # EntityModelGroupResponse documents the actual wire shape returned by the hand-written getGroup
    # — GroupResponse's properties (owners/members/pendingInvitations are themselves arrays of
    # HAL-wrapped items, each carrying its own _links) plus the envelope's own _links — but is not
    # referenced by any schemaMappings entry: getGroup is excluded from generation (see the comment
    # on that operation above and the module header comment).
    EntityModelGroupResponse:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            owners:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelOwnerResponse'
            members:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelFreeGroupMembershipResponse'
            pendingInvitations:
              type: array
              description: Present only when the caller is an owner of this group.
              items:
                $ref: '#/components/schemas/EntityModelPendingInvitationResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelOwnerResponse:
      allOf:
        - type: object
          properties:
            memberId:
              type: string
              format: uuid
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelFreeGroupMembershipResponse:
      allOf:
        - type: object
          properties:
            memberId:
              type: string
              format: uuid
            joinedAt:
              type: string
              format: date-time
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    # PendingInvitationResponse embedded inside EntityModelGroupResponse.pendingInvitations (owner
    # view of a single group's own invitations — carries a "self" affordance for cancelInvitation on
    # top of the accept/reject rels every view carries, per InvitationModelBuilder.build()).
    EntityModelPendingInvitationResponse:
      allOf:
        - $ref: '#/components/schemas/PendingInvitationResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    PendingInvitationResponse:
      type: object
      properties:
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        invitationId:
          type: string
          format: uuid
        invitedBy:
          type: string
          format: uuid

    # === Invitations ==============================================================================

    # getPendingInvitations (InvitationModelBuilder.buildFromView) never adds the owner-only "self"
    # +cancelInvitation affordance that EntityModelPendingInvitationResponse above carries — only
    # invitedMember/accept/reject. A separate envelope schema documents that narrower shape so this
    # collection's items are not mistaken for carrying a cancel affordance they never have.
    CollectionModelEntityModelPendingInvitationResponseForInvitationsList:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            pendingInvitationResponseList:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelPendingInvitationResponseForInvitationsList'
        _links:
          $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelPendingInvitationResponseForInvitationsList:
      allOf:
        - $ref: '#/components/schemas/PendingInvitationResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    # === TrainingGroups ===========================================================================

    CreateTrainingGroupRequest:
      type: object
      required: [name, trainerId, minAge, maxAge]
      properties:
        name:
          type: string
          minLength: 1
        trainerId:
          type: string
          format: uuid
        minAge:
          type: integer
          format: int32
          minimum: 0
        maxAge:
          type: integer
          format: int32
          minimum: 0

    # TrainingGroupAddMemberRequest, not AddMemberRequest — a same-named FamilyGroups schema already
    # occupies that name in this one global component namespace after bundling (both wrap a single
    # memberId field but are unrelated types); see klabis-api-spec skill: "Component names are global
    # once bundled" / "Prefix module-owned components rather than reaching for the generic name".
    TrainingGroupAddMemberRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    AddTrainerRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    AgeRangeRequest:
      type: object
      required: [minAge, maxAge]
      properties:
        minAge:
          type: integer
          format: int32
          minimum: 0
        maxAge:
          type: integer
          format: int32
          minimum: 0

    # UpdateTrainingGroupRequest is a PATCH request whose every property is a PatchField<T> wrapper —
    # same pattern as members.yaml's UpdateMemberRequest and events.yaml's UpdateEventRequest.
    # "required" only means "present"; the PatchField absent/null/value tri-state has no OpenAPI
    # equivalent (see klabis-api-spec skill).
    UpdateTrainingGroupRequest:
      type: object
      description: |
        Partial update request. Every property is a PatchField wrapper: an absent property is left
        untouched, whereas an explicitly null value is rejected by the domain (name/ageRange cannot
        be cleared). trainers, when provided, replaces the full trainer set.
      properties:
        name:
          $ref: '#/components/schemas/PatchFieldString'
        ageRange:
          $ref: '#/components/schemas/PatchFieldAgeRangeRequest'
        trainers:
          $ref: '#/components/schemas/PatchFieldTrainerIds'

    PatchFieldString:
      type: string
      nullable: true

    PatchFieldAgeRangeRequest:
      $ref: '#/components/schemas/AgeRangeRequest'

    PatchFieldTrainerIds:
      type: array
      items:
        type: string
        format: uuid

    CollectionModelEntityModelTrainingGroupSummaryResponse:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            trainingGroupSummaryResponseList:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelTrainingGroupSummaryResponse'
        _links:
          $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelTrainingGroupSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/TrainingGroupSummaryResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    TrainingGroupSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        minAge:
          type: integer
          format: int32
        maxAge:
          type: integer
          format: int32
        memberCount:
          type: integer
          format: int32

    # EntityModelTrainingGroupResponse documents the actual wire shape returned by the hand-written
    # getTrainingGroup — TrainingGroupResponse's properties (trainers/members are themselves arrays
    # of HAL-wrapped items, each carrying its own _links) plus the envelope's own _links/_templates —
    # but is not referenced by any schemaMappings entry: getTrainingGroup is excluded from generation
    # (see the comment on that operation above and the module header comment). ageRange and members
    # are omitted (JsonInclude.NON_NULL) in the reduced response returned to callers without
    # GROUPS:TRAINING — see the description on getTrainingGroup.
    EntityModelTrainingGroupResponse:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            ageRange:
              $ref: '#/components/schemas/AgeRangeResponse'
            trainers:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelTrainerResponse'
            members:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelGroupMembershipResponse'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'
            _templates:
              $ref: './_shared/hal.yaml#/components/schemas/HalFormsTemplates'

    AgeRangeResponse:
      type: object
      properties:
        minAge:
          type: integer
          format: int32
        maxAge:
          type: integer
          format: int32

    EntityModelTrainerResponse:
      allOf:
        - type: object
          properties:
            memberId:
              type: string
              format: uuid
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'

    EntityModelGroupMembershipResponse:
      allOf:
        - type: object
          properties:
            memberId:
              type: string
              format: uuid
            joinedAt:
              type: string
              format: date-time
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'
