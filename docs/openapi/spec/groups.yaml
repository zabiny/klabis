components:
  securitySchemes:
    KlabisAuth:
      type: oauth2
      description: OAuth2 authentication with Klabis Authorization Server
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: authenticate
            profile: display user profile information
            MEMBERS: Members
            EVENTS: Events

  parameters:
    FamilyGroupIdParam:
      name: id
      in: path
      required: true
      description: Family group UUID
      schema:
        type: string
        format: uuid

    FreeGroupIdParam:
      name: id
      in: path
      required: true
      description: Group UUID
      schema:
        type: string
        format: uuid

    InvitationIdParam:
      name: invitationId
      in: path
      required: true
      description: Invitation UUID
      schema:
        type: string
        format: uuid

    TrainingGroupIdParam:
      name: id
      in: path
      required: true
      description: Training group UUID
      schema:
        type: string
        format: uuid

  schemas:

    # === FamilyGroups ============================================================================

    CreateFamilyGroupRequest:
      type: object
      required: [name, parent]
      properties:
        name:
          type: string
          minLength: 1
        parent:
          type: string
          format: uuid

    AddMemberRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    FamilyGroupSummaryResponse:
      type: object
      x-klabis-relation:
        collectionRelation: familyGroupSummaryResponseList
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberCount:
          type: integer
          format: int32

    # getFamilyGroup's payload. parents/members are arrays of HAL-wrapped items (each carrying its
    # own _links/_templates at runtime), so the Java record fields resolve to List<EntityModel<X>>.
    # x-hal-entity-items: true on each array declares that: the bundler derives an EntityModel<X>
    # item schema, KlabisSpringCodegen.fromProperty reads the same marker and maps the property onto
    # org.springframework.hateoas.EntityModel<X>. The response-level HAL envelope is derived too.
    FamilyGroupResponse:
      type: object
      description: Family group detail with parents and children as independently linked items.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parents:
          type: array
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/ParentResponse'
        members:
          type: array
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/FamilyGroupMembershipResponse'

    ParentResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid

    FamilyGroupMembershipResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time

    # === Groups (FreeGroup) ======================================================================

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    RenameGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    AddOwnerRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    InviteMemberRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    CancelInvitationRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    GroupSummaryResponse:
      type: object
      x-klabis-relation:
        collectionRelation: groupSummaryResponseList
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # getGroup's payload — see FamilyGroupResponse for why owners/members/pendingInvitations resolve
    # to List<EntityModel<X>> via x-hal-entity-items.
    GroupResponse:
      type: object
      description: Free group detail with owners, members and invitations as independently linked items.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owners:
          type: array
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/OwnerResponse'
        members:
          type: array
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/FreeGroupMembershipResponse'
        pendingInvitations:
          type: array
          description: Present only when the caller is an owner of this group.
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/PendingInvitationResponse'

    OwnerResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid

    FreeGroupMembershipResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time

    PendingInvitationResponse:
      type: object
      x-klabis-relation:
        collectionRelation: pendingInvitationResponseList
      properties:
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        invitationId:
          type: string
          format: uuid
        invitedBy:
          type: string
          format: uuid

    # === TrainingGroups ===========================================================================

    CreateTrainingGroupRequest:
      type: object
      required: [name, trainerId, minAge, maxAge]
      properties:
        name:
          type: string
          minLength: 1
        trainerId:
          type: string
          format: uuid
        minAge:
          type: integer
          format: int32
          minimum: 0
        maxAge:
          type: integer
          format: int32
          minimum: 0

    # TrainingGroupAddMemberRequest, not AddMemberRequest — a same-named FamilyGroups schema already
    # occupies that name in this one global component namespace after bundling (both wrap a single
    # memberId field but are unrelated types); see klabis-api-spec skill: "Component names are global
    # once bundled" / "Prefix module-owned components rather than reaching for the generic name".
    TrainingGroupAddMemberRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    AddTrainerRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid

    AgeRangeRequest:
      type: object
      required: [minAge, maxAge]
      properties:
        minAge:
          type: integer
          format: int32
          minimum: 0
        maxAge:
          type: integer
          format: int32
          minimum: 0

    # Every property is nullable so the generator emits JsonNullable<T>, which carries the
    # absent/null/value tri-state a PATCH body needs. Properties are inlined rather than sharing
    # named wrapper schemas: a shared schema cannot carry per-property constraints.
    UpdateTrainingGroupRequest:
      type: object
      description: |
        Partial update request. An absent property is left untouched, whereas an explicitly null
        value is rejected by the domain (name/ageRange cannot be cleared). trainers, when provided,
        replaces the full trainer set.
      properties:
        name:
          type: ['string', 'null']
        ageRange:
          oneOf:
            - $ref: '#/components/schemas/AgeRangeRequest'
            - type: 'null'
        trainers:
          type: ['array', 'null']
          items:
            type: string
            format: uuid

    TrainingGroupSummaryResponse:
      type: object
      x-klabis-relation:
        collectionRelation: trainingGroupSummaryResponseList
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        minAge:
          type: integer
          format: int32
        maxAge:
          type: integer
          format: int32
        memberCount:
          type: integer
          format: int32

    # getTrainingGroup's payload — see FamilyGroupResponse for why trainers/members resolve to
    # List<EntityModel<X>> via x-hal-entity-items. ageRange and members are omitted
    # (JsonInclude.NON_NULL) in the reduced response returned to callers without GROUPS:TRAINING —
    # see the description on getTrainingGroup.
    TrainingGroupResponse:
      type: object
      description: Training group detail with trainers and members as independently linked items.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ageRange:
          $ref: '#/components/schemas/AgeRangeResponse'
        trainers:
          type: array
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/TrainerResponse'
        members:
          type: array
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/GroupMembershipResponse'

    AgeRangeResponse:
      type: object
      properties:
        minAge:
          type: integer
          format: int32
        maxAge:
          type: integer
          format: int32

    TrainerResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid

    GroupMembershipResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time
