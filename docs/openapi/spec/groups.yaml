# Groups module — the API surface of FreeGroupController, PendingInvitationsController and
# TrainingGroupController (groups module). Legal guardian groups belong to the members module and live in
# members.yaml.
#
# getGroup and getTrainingGroup return the payload DTO, like every other operation.
# Each response declares only its application/json payload; the bundler derives the
# application/prs.hal-forms+json envelope into klabis-full.json.
#
# GroupResponse and TrainingGroupResponse are both fully generated. Their
# collection fields (parents/members/owners/pendingInvitations/trainers) resolve to
# List<EntityModel<Item>> — each item may carry its own _links/_templates, which ones depending on
# the caller's authorization (e.g. removeGroupOwner appears on an owner row only for an owner). Each such array
# is marked x-hal-entity-items: true with items pointing at the bare payload schema. The bundler's
# deriver reads that marker to reconstruct the EntityModel<Item> schema in klabis-full.json;
# KlabisSpringCodegen#fromProperty reads the same marker off this file and maps the property onto
# org.springframework.hateoas.EntityModel<Item>. No per-schema schemaMappings entry is involved.
#
# Three different authorization patterns coexist in this module — transcribed here exactly as found,
# never normalized:
#   a) Declarative — TrainingGroupController (GROUPS_TRAINING) carries @HasAuthority on most
#      operations -> x-klabis-authority.
#   b) Authorization inside the domain service — every FreeGroupController operation (Groups tag)
#      passes @ActingMember into FreeGroupManagementPort and the ownership rule (owner-only /
#      member-only) is enforced down in FreeGroup itself. The controller carries NO @HasAuthority.
#      These 13 operations get NO x-klabis-authority / x-klabis-owner-visible — the check is neither
#      an authority nor an owner-id-vs-caller comparison the framework can express, it is "is the
#      caller a member of THIS group's owner/member set", which only the aggregate can answer.
#   c) Imperative in the method body — TrainingGroupController.getTrainingGroup throws
#      InsufficientAuthorityException unless the caller has GROUPS:TRAINING OR is a member of the specific group.
#      x-klabis-authority alone would lock out those members, and pairing it with
#      x-klabis-owner-visible (which does OR with an authority) cannot help either: group
#      membership is a set stored on the group, not an owner ID this spec can name as a parameter.
#      PendingInvitationsController.getPendingInvitations has
#      no annotation either — it always acts on the caller's own invitations, via @ActingMember, so
#      there is nothing to authorize beyond authentication.
#
# _embedded keys on the three collection responses come from the deriver (Decision 5): the payload's
# x-klabis-relation.collectionRelation where declared, else Spring HATEOAS's uncapitalize(name)+"List"
# default. Cross-checked against @Relation on each payload class (grep across groups/ found only
# GroupSummaryResponse and PendingInvitationResponse annotated; both match the default, so no
# divergence):
#   GroupSummaryResponse       @Relation(collectionRelation = "groupSummaryResponseList") (= default)
#   TrainingGroupSummaryResponse (no @Relation) -> trainingGroupSummaryResponseList (default)
#   PendingInvitationResponse  @Relation(collectionRelation = "pendingInvitationResponseList") (= default)

# Standalone OpenAPI document: this file renders on its own in Swagger UI / Redoc, served
# from this directory so its ./_shared/*.yaml refs resolve. info is duplicated from
# klabis.yaml rather than shared, because $ref cannot target a document's own info; the
# bundler ignores both keys (modules are pulled in by #/paths/... pointer, never whole-file)
# and validate.mjs pins version to the root's so the two cannot drift.
openapi: 3.1.0

info:
  title: Klabis API — Groups module
  description: The Groups slice of the Klabis API. See klabis.yaml for the full API.
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://api.klabis.com
    description: Production server

paths:

  # ---------------------------------------------------------------------------------------------
  # Groups (FreeGroupController, /api/groups) — 13 operations
  #
  # NONE of these carry x-klabis-authority / x-klabis-owner-visible. Authorization is enforced
  # inside FreeGroupManagementPort/FreeGroup itself from the @ActingMember passed by the controller
  # (module header comment, pattern b) — "is the caller a member/owner of THIS group", which is not
  # an authority check and not a simple owner-id-vs-path-variable comparison. Do not add either
  # extension here; that would either lock out legitimate callers or grant access the domain does not.
  # ---------------------------------------------------------------------------------------------

  /api/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List groups where the authenticated member is a member
      description: Returns free groups the authenticated member belongs to (owner or plain member).
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      responses:
        '200':
          description: List of groups retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSummaryResponse'
          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            createGroup:
              operation: createGroup
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a members group
      description: Creates a new free group; the authenticated member becomes its first owner.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          headers:
            Location:
              description: URI of the created group
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}:
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Get group details (owner or member only)
      # Imperative check in FreeGroupController.getGroup: FreeGroup.isOwner/hasMember. See module
      # header comment (pattern b/c).
      description: |
        Returns group details including owners, members and — for owners only — pending invitations,
        each with its own hypermedia links. Caller must be an owner or a member of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
          x-hal-links:
            self:
              description: This group. Carries write affordances only for owners.
            collection:
              operation: listGroups
              description: Back to the group list
          x-hal-templates:
            updateGroup:
              operation: updateGroup
              description: Present only for group owners
            deleteGroup:
              operation: deleteGroup
              description: Present only for group owners
            addGroupOwner:
              operation: addGroupOwner
              description: Present only for group owners
            inviteMember:
              operation: inviteMember
              description: Present only for group owners
            leaveGroup:
              operation: removeGroupMember
              description: >
                Present only for members who are not owners. It is the removeGroupMember affordance
                with the caller's own memberId substituted for the path variable, i.e. "leave this
                group".
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    patch:
      operationId: updateGroup
      tags: [Groups]
      summary: Rename a group (owner only)
      description: Renames a group. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameGroupRequest'
      responses:
        '204':
          description: Group renamed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a group (owner only)
      description: Deletes a group. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      responses:
        '204':
          description: Group deleted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}/members/{memberId}:
    delete:
      operationId: removeGroupMember
      tags: [Groups]
      summary: Remove a member from group (owner, or the member themselves)
      description: >-
        Removes a member from a group. The caller must either be an owner of this group or the
        member identified by memberId themselves. Owners are not members of their own group and are
        removed through removeGroupOwner instead.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
        - name: memberId
          in: path
          required: true
          description: Member UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}/owners:
    post:
      operationId: addGroupOwner
      tags: [Groups]
      summary: Add an owner to group (owner only)
      description: Promotes an existing member to owner. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOwnerRequest'
      responses:
        '204':
          description: Owner added
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}/owners/{memberId}:
    delete:
      operationId: removeGroupOwner
      tags: [Groups]
      summary: Remove an owner from group (owner only)
      description: Demotes an owner back to plain member. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
        - name: memberId
          in: path
          required: true
          description: Owner member UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Owner removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}/invitations:
    post:
      operationId: inviteMember
      tags: [Groups]
      summary: Invite a member to a members group (owner only)
      description: Creates a pending invitation. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '204':
          description: Invitation created
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}/invitations/{invitationId}:
    delete:
      operationId: cancelInvitation
      tags: [Groups]
      summary: Cancel a pending invitation (owner only)
      description: Cancels a pending invitation. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
        - $ref: '#/components/parameters/InvitationIdParam'
      requestBody:
        required: false
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInvitationRequest'
      responses:
        '204':
          description: Invitation cancelled
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}/invitations/{invitationId}/accept:
    post:
      operationId: acceptInvitation
      tags: [Groups]
      summary: Accept a pending invitation
      description: Accepts a pending invitation addressed to the authenticated member.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
        - $ref: '#/components/parameters/InvitationIdParam'
      responses:
        '204':
          description: Invitation accepted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/groups/{id}/invitations/{invitationId}/reject:
    post:
      operationId: rejectInvitation
      tags: [Groups]
      summary: Reject a pending invitation
      description: Rejects a pending invitation addressed to the authenticated member.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
        - $ref: '#/components/parameters/InvitationIdParam'
      responses:
        '204':
          description: Invitation rejected
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------------------------------------
  # Invitations (PendingInvitationsController, /api/invitations) — 1 operation
  # ---------------------------------------------------------------------------------------------

  /api/invitations/pending:
    get:
      operationId: getPendingInvitations
      tags: [Invitations]
      summary: List current user's pending invitations across all groups
      # No annotation in PendingInvitationsController — @ActingMember means the endpoint always acts
      # on the caller's own invitations, so there is nothing beyond authentication to authorize
      # (module header comment, pattern c).
      description: Returns pending invitations addressed to the authenticated member, across all groups.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      responses:
        '200':
          description: Pending invitations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingInvitationResponse'
          x-hal-links:
            self:
              description: This collection
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------------------------------------
  # TrainingGroups (TrainingGroupController, /api/training-groups) — 9 operations
  # ---------------------------------------------------------------------------------------------

  /api/training-groups:
    get:
      operationId: listTrainingGroups
      tags: [TrainingGroups]
      summary: List all training groups
      description: Returns all training groups. Requires GROUPS:TRAINING.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: GROUPS_TRAINING
      responses:
        '200':
          description: List of training groups retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingGroupSummaryResponse'
          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            createTrainingGroup:
              operation: createTrainingGroup
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: createTrainingGroup
      tags: [TrainingGroups]
      summary: Create a training group
      description: Creates a new training group with a trainer and an age range. Requires GROUPS:TRAINING.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: GROUPS_TRAINING
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingGroupRequest'
      responses:
        '201':
          description: Training group created
          headers:
            Location:
              description: URI of the created training group
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/training-groups/{id}:
    get:
      operationId: getTrainingGroup
      tags: [TrainingGroups]
      summary: Get training group details
      # Imperative check in TrainingGroupController.getTrainingGroup: GROUPS:TRAINING OR
      # membership OR being a trainer of this group. An OR-rule, so no x-klabis-authority is
      # declared — see module header comment (pattern c).
      # Callers without GROUPS:TRAINING receive a reduced response (name/trainers
      # only, no members, no ageRange) built by buildLimitedGroupResponse — not expressible as a
      # single schema; documented here as the full (GROUPS:TRAINING) shape.
      description: |
        Returns training group details including trainers and members with their own hypermedia
        links. Requires GROUPS:TRAINING, or the caller must be a member or trainer of this group (in
        which case a reduced response — name and trainers only — is returned).
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.members.CurrentUserData currentUser'
      parameters:
