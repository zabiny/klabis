        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/family-groups/{id}/children/{memberId}:
    delete:
      operationId: removeFamilyGroupChild
      tags: [FamilyGroups]
      summary: Remove a child from family group
      description: Removes a child from the family group. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
        - name: memberId
          in: path
          required: true
          description: Child member UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Child removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------------------------------------
  # Groups (FreeGroupController, /api/groups) — 13 operations
  #
  # NONE of these carry x-klabis-authority / x-klabis-owner-visible. Authorization is enforced
  # inside FreeGroupManagementPort/FreeGroup itself from the @ActingMember passed by the controller
  # (module header comment, pattern b) — "is the caller a member/owner of THIS group", which is not
  # an authority check and not a simple owner-id-vs-path-variable comparison. Do not add either
  # extension here; that would either lock out legitimate callers or grant access the domain does not.
  # ---------------------------------------------------------------------------------------------

  /api/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List groups where the authenticated member is a member
      description: Returns free groups the authenticated member belongs to (owner or plain member).
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      responses:
        '200':
          description: List of groups retrieved successfully
          content:
            application/prs.hal-forms+json:
              schema:
                $ref: '#/components/schemas/CollectionModelEntityModelGroupSummaryResponse'
          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            default:
              operation: createGroup
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a members group
      description: Creates a new free group; the authenticated member becomes its first owner.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          headers:
            Location:
              description: URI of the created group
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/groups/{id}:
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Get group details (owner or member only)
      # Imperative check in FreeGroupController.getGroup: FreeGroup.isOwner/hasMember. See module
      # header comment (pattern b/c) and top-of-file exclusion note.
      description: |
        Returns group details including owners, members and — for owners only — pending invitations,
        each with its own hypermedia links. Caller must be an owner or a member of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      responses:
        '200':
          description: Group found
          content:
            application/prs.hal-forms+json:
              schema:
                $ref: '#/components/schemas/EntityModelGroupResponse'
          x-hal-links:
            self:
              description: This group. Carries write affordances only for owners.
            collection:
              operation: listGroups
              description: Back to the group list
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    patch:
      operationId: updateGroup
      tags: [Groups]
      summary: Rename a group (owner only)
      description: Renames a group. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameGroupRequest'
      responses:
        '204':
          description: Group renamed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a group (owner only)
      description: Deletes a group. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
      responses:
        '204':
          description: Group deleted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/groups/{id}/members/{memberId}:
    delete:
      operationId: removeGroupMember
      tags: [Groups]
      summary: Remove a member from group (owner only)
      description: Removes a member from a group. Caller must be an owner of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingMember com.klabis.members.MemberId actingMember'
      parameters:
        - $ref: '#/components/parameters/FreeGroupIdParam'
        - name: memberId
          in: path
          required: true
          description: Member UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/groups/{id}/owners:
