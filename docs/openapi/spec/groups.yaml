# Groups module — the API surface of FamilyGroupController, FreeGroupController,
# PendingInvitationsController and TrainingGroupController (groups module).
#
# Three Java packages share this one spec file: groups.familygroup.infrastructure.restapi,
# groups.freegroup.infrastructure.restapi and groups.traininggroup.infrastructure.restapi.
# openApiModule(...) in build.gradle.kts registers THREE separate codegen tasks against this single
# file (groupsFamily / groupsFree / groupsTraining), one per package, each scoped to its own tags —
# see klabis-api-spec skill: "Registering a module for codegen".
#
# getFamilyGroup, getGroup and getTrainingGroup return the payload DTO, like every other operation.
# Each response declares only its application/json payload; the bundler derives the
# application/prs.hal-forms+json envelope into klabis-full.json.
#
# FamilyGroupResponse, GroupResponse and TrainingGroupResponse are ALL fully generated. Their
# collection fields (parents/members/owners/pendingInvitations/trainers) resolve to
# List<EntityModel<Item>> — each item may carry its own _links/_templates, which ones depending on
# the caller's authorization (e.g. removeGroupOwner appears on an owner row only for an owner). Each such array
# is marked x-hal-entity-items: true with items pointing at the bare payload schema. The bundler's
# deriver reads that marker to reconstruct the EntityModel<Item> schema in klabis-full.json;
# KlabisSpringCodegen#fromProperty reads the same marker off this file and maps the property onto
# org.springframework.hateoas.EntityModel<Item>. No per-schema schemaMappings entry is involved.
#
# Three different authorization patterns coexist in this module — transcribed here exactly as found,
# never normalized:
#   a) Declarative — FamilyGroupController (MEMBERS_MANAGE) and TrainingGroupController
#      (GROUPS_TRAINING) carry @HasAuthority on most operations -> x-klabis-authority.
#   b) Authorization inside the domain service — every FreeGroupController operation (Groups tag)
#      passes @ActingMember into FreeGroupManagementPort and the ownership rule (owner-only /
#      member-only) is enforced down in FreeGroup itself. The controller carries NO @HasAuthority.
#      These 13 operations get NO x-klabis-authority / x-klabis-owner-visible — the check is neither
#      an authority nor an owner-id-vs-caller comparison the framework can express, it is "is the
#      caller a member of THIS group's owner/member set", which only the aggregate can answer.
#   c) Imperative in the method body — FamilyGroupController.getFamilyGroup and
#      TrainingGroupController.getTrainingGroup throw InsufficientAuthorityException unless the
#      caller has the module's MANAGE/TRAINING authority OR is a member of the specific group.
#      x-klabis-authority alone would lock out those members, and pairing it with
#      x-klabis-owner-visible (which does OR with an authority) cannot help either: group
#      membership is a set stored on the group, not an owner ID this spec can name as a parameter.
#      PendingInvitationsController.getPendingInvitations has
#      no annotation either — it always acts on the caller's own invitations, via @ActingMember, so
#      there is nothing to authorize beyond authentication.
#
# _embedded keys on the four collection responses come from the deriver (Decision 5): the payload's
# x-klabis-relation.collectionRelation where declared, else Spring HATEOAS's uncapitalize(name)+"List"
# default. Cross-checked against @Relation on each payload class (grep across groups/ found only
# GroupSummaryResponse and PendingInvitationResponse annotated; both match the default, so no
# divergence):
#   FamilyGroupSummaryResponse (no @Relation) -> familyGroupSummaryResponseList (default)
#   GroupSummaryResponse       @Relation(collectionRelation = "groupSummaryResponseList") (= default)
#   TrainingGroupSummaryResponse (no @Relation) -> trainingGroupSummaryResponseList (default)
#   PendingInvitationResponse  @Relation(collectionRelation = "pendingInvitationResponseList") (= default)

# Standalone OpenAPI document: this file renders on its own in Swagger UI / Redoc, served
# from this directory so its ./_shared/*.yaml refs resolve. info is duplicated from
# klabis.yaml rather than shared, because $ref cannot target a document's own info; the
# bundler ignores both keys (modules are pulled in by #/paths/... pointer, never whole-file)
# and validate.mjs pins version to the root's so the two cannot drift.
openapi: 3.1.0

info:
  title: Klabis API — Groups module
  description: The Groups slice of the Klabis API. See klabis.yaml for the full API.
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://api.klabis.com
    description: Production server

paths:

  # ---------------------------------------------------------------------------------------------
  # FamilyGroups (FamilyGroupController, /api/family-groups) — 8 operations
  # ---------------------------------------------------------------------------------------------

  /api/family-groups:
    get:
      operationId: listFamilyGroups
      tags: [FamilyGroups]
      summary: List all family groups
      description: Returns all family groups. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      responses:
        '200':
          description: List of family groups retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyGroupSummaryResponse'
          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            default:
              operation: createFamilyGroup
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: createFamilyGroup
      tags: [FamilyGroups]
      summary: Create a family group
      description: Creates a new family group with a single parent. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamilyGroupRequest'
      responses:
        '201':
          description: Family group created
          headers:
            Location:
              description: URI of the created family group
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/family-groups/{id}:
    get:
      operationId: getFamilyGroup
      tags: [FamilyGroups]
      summary: Get family group details
      # Imperative check in FamilyGroupController.getFamilyGroup: MEMBERS:MANAGE OR family-group
      # membership, which no extension can express — group membership is not an owner ID nameable
      # as a parameter. See module header comment (pattern c).
      description: |
        Returns family group details including parents and children with their own hypermedia links.
        Requires MEMBERS:MANAGE, or the caller must be a member (parent or child) of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingUser com.klabis.members.CurrentUserData currentUser'
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
      responses:
        '200':
          description: Family group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyGroupResponse'
          x-hal-links:
            self:
              description: This family group
            collection:
              operation: listFamilyGroups
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteFamilyGroup
      tags: [FamilyGroups]
      summary: Delete a family group
      description: Deletes a family group. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
      responses:
        '204':
          description: Family group deleted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

