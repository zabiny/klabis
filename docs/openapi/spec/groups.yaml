          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            default:
              operation: createFamilyGroup
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    post:
      operationId: createFamilyGroup
      tags: [FamilyGroups]
      summary: Create a family group
      description: Creates a new family group with a single parent. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamilyGroupRequest'
      responses:
        '201':
          description: Family group created
          headers:
            Location:
              description: URI of the created family group
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/family-groups/{id}:
    get:
      operationId: getFamilyGroup
      tags: [FamilyGroups]
      summary: Get family group details
      # Imperative check in FamilyGroupController.getFamilyGroup: MEMBERS:MANAGE OR family-group
      # membership, which no extension can express — group membership is not an owner ID nameable
      # as a parameter. See module header comment (pattern c). Excluded from generation too.
      description: |
        Returns family group details including parents and children with their own hypermedia links.
        Requires MEMBERS:MANAGE, or the caller must be a member (parent or child) of this group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.members.ActingUser com.klabis.members.CurrentUserData currentUser'
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
      responses:
        '200':
          description: Family group found
          content:
            application/prs.hal-forms+json:
              schema:
                $ref: '#/components/schemas/EntityModelFamilyGroupResponse'
          x-hal-links:
            self:
              description: This family group
            collection:
              operation: listFamilyGroups
              description: Present only for callers with MEMBERS:MANAGE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteFamilyGroup
      tags: [FamilyGroups]
      summary: Delete a family group
      description: Deletes a family group. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
      responses:
        '204':
          description: Family group deleted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/family-groups/{id}/parents:
    post:
      operationId: addFamilyGroupParent
      tags: [FamilyGroups]
      summary: Add a parent to family group
      description: Adds a parent to the family group. Requires MEMBERS:MANAGE.
      security:
