      tags: [FamilyGroups]
      summary: Add a parent to family group
      description: Adds a parent to the family group. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '204':
          description: Parent added
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/family-groups/{id}/parents/{memberId}:
    delete:
      operationId: removeFamilyGroupParent
      tags: [FamilyGroups]
      summary: Remove a parent from family group
      description: Removes a parent from the family group. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
        - name: memberId
          in: path
          required: true
          description: Parent member UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Parent removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/family-groups/{id}/children:
    post:
      operationId: addFamilyGroupChild
      tags: [FamilyGroups]
      summary: Add a child to family group
      description: Adds a child to the family group. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '204':
          description: Child added
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/family-groups/{id}/children/{memberId}:
    delete:
      operationId: removeFamilyGroupChild
      tags: [FamilyGroups]
      summary: Remove a child from family group
      description: Removes a child from the family group. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/FamilyGroupIdParam'
        - name: memberId
          in: path
          required: true
          description: Child member UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Child removed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
