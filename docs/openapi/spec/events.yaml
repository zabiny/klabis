          pattern: '\d{6,7}'
        categoryId:
          type: string
          format: uuid
        wantsSharedTransport:
          type: boolean
          default: false
          description: |
            Member opts into the event's shared transport. Meaningful only when the event offers
            it; the registration form omits this property otherwise. Defaults to false.
        wantsSharedAccommodation:
          type: boolean
          default: false
          description: |
            Member opts into the event's shared accommodation. Meaningful only when the event
            offers it; the registration form omits this property otherwise. Defaults to false.

    EditRegistrationRequest:
      type: object
      required: [siCardNumber]
      properties:
        siCardNumber:
          type: string
          pattern: '\d{6,7}'
        categoryId:
          type: string
          format: uuid
        wantsSharedTransport:
          type: boolean
          default: false
          description: |
            Member's shared-transport choice. Meaningful only when the event offers it; the edit
            form omits this property otherwise. Defaults to false.
        wantsSharedAccommodation:
          type: boolean
          default: false
          description: |
            Member's shared-accommodation choice. Meaningful only when the event offers it; the
            edit form omits this property otherwise. Defaults to false.

    # A named schema, not an inline array: the item payload needs a stable wire-contract name. Two
    # operations derive from it — getEvent's x-hal-embedded builds the
    # EntityModel<RegistrationSummaryDto> row, listRegistrations the collection envelope.
    RegistrationSummaryDto:
      type: object
      description: |
        Registration summary for list views. SI card numbers are not included. registrationTime is
        visible to the registered member OR callers with EVENTS:REGISTRATIONS.
      x-klabis-relation:
        collectionRelation: registrationDtoList
      properties:
        firstName:
          type: string
        lastName:
          type: string
        category:
          $ref: '#/components/schemas/EventCategoryDto'
          x-field-extra-annotation: com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.ALWAYS)
        registrationTime:
          type: string
          format: date-time
          x-klabis-authority: EVENTS_REGISTRATIONS
          x-klabis-owner-visible: true
        wantsSharedTransport:
          type: boolean
          description: |
            Member's shared-transport choice. Present only when the event offers shared transport.
        wantsSharedAccommodation:
          type: boolean
          description: |
            Member's shared-accommodation choice. Present only when the event offers shared
            accommodation.
        # Kept off the wire (@JsonIgnore) but present in the generated Java: coordinators doubles
        # as the @OwnerId source OwnershipResolver needs to evaluate registrationTime's
        # @OwnerVisible. See design.md Decision 0 / x-field-extra-annotation for why plain omission
        # from this schema (the approach used elsewhere for @JsonIgnore) does not work here.
        coordinators:
          type: array
          items:
            type: string
            format: uuid
          x-klabis-owner-id: true
          x-field-extra-annotation: com.fasterxml.jackson.annotation.JsonIgnore
        # Needed only by RegistrationRecordTransactionLinkProcessor at runtime (never on the wire);
        # no ownership role, unlike coordinators above.
        registeredMemberId:
          type: string
          format: uuid
          x-field-extra-annotation: com.fasterxml.jackson.annotation.JsonIgnore

