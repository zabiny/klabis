        # No `format: uri` — see the note on UpdateEventRequest.websiteUrl.
        websiteUrl:
          type: string
          x-klabis-url: true
        coordinators:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        eventTypeId:
          type: string
          format: uuid
        deadlines:
          type: array
          maxItems: 3
          items:
            type: string
            format: date
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CreateEventCategoryRequest'
        sharedTransportEnabled:
          type: boolean
          default: false
          description: Offer shared transport for this event. Defaults to false when omitted.
        sharedAccommodationEnabled:
          type: boolean
          default: false
          description: Offer shared accommodation for this event. Defaults to false when omitted.

    CreateEventCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
          x-klabis-not-blank: true
        fee:
          $ref: '#/components/schemas/EntryFeeRequest'

    EntryFeeRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3

    UpdateEventRequest:
      type: object
      x-klabis-class-constraint: com.klabis.events.infrastructure.restapi.DeadlinesOrdered
      description: |
        Partial update request. Every property is a JsonNullable wrapper: an absent property is left
        untouched, whereas an explicitly null value clears the field (where the underlying field is
        optional). Category `id` present = update an existing category (must belong to this event);
        absent = a new category, server assigns a fresh id. Deadlines, when provided, must be in
        non-decreasing order.

        Properties are inlined rather than sharing PatchField* wrapper schemas: a shared schema
        cannot carry per-property constraints, and the generator drops maxLength/pattern from a
        mapped schema. See the klabis-api-spec skill.
      properties:
        name:
          type: [string, 'null']
          maxLength: 100
          x-klabis-not-blank: true
        eventDate:
          type: [string, 'null']
          format: date
        location:
          type: [string, 'null']
          maxLength: 100
        organizer:
          type: [string, 'null']
          maxLength: 10
          x-klabis-not-blank: true
        # No `format: uri`: it makes the generator emit java.net.URI, which @URL cannot validate
        # (it constrains CharSequence) and which would change the mapper's contract. x-klabis-url
        # carries the validation instead.
        websiteUrl:
          type: [string, 'null']
          x-klabis-url: true
        coordinators:
          type: [array, 'null']
          uniqueItems: true
          items:
            type: string
            format: uuid
        eventTypeId:
          type: [string, 'null']
          format: uuid
        deadlines:
          type: [array, 'null']
          maxItems: 3
          items:
            type: string
            format: date
        categories:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/UpdateEventCategoryRequest'
        ranking:
          oneOf:
            - $ref: '#/components/schemas/UpdateEventRankingRequest'
            - type: 'null'
        baseEntryFee:
          oneOf:
            - $ref: '#/components/schemas/EntryFeeRequest'
            - type: 'null'
        sharedTransportEnabled:
          type: [boolean, 'null']
          description: |
            Offer shared transport. Absent leaves the current setting; a value replaces it.
            Turning it off is always allowed and retains any member choices already made.
        sharedAccommodationEnabled:
          type: [boolean, 'null']
          description: |
            Offer shared accommodation. Absent leaves the current setting; a value replaces it.
            Turning it off is always allowed and retains any member choices already made.

    UpdateEventCategoryRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
        name:
