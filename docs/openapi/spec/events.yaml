components:
  securitySchemes:
    KlabisAuth:
      type: oauth2
      description: OAuth2 authentication with Klabis Authorization Server
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: authenticate
            profile: display user profile information
            MEMBERS: Members
            EVENTS: Events

  parameters:
    EventIdParam:
      name: id
      in: path
      description: Event UUID
      required: true
      schema:
        type: string
        format: uuid

    EventTypeIdParam:
      name: id
      in: path
      description: Event type UUID
      required: true
      schema:
        type: string
        format: uuid

    RegEventIdParam:
      name: eventId
      in: path
      description: Event UUID
      required: true
      schema:
        type: string
        format: uuid

    RegMemberIdParam:
      name: memberId
      in: path
      description: Member UUID
      required: true
      # Marks the owner for operations that declare x-klabis-owner-visible. Inert on its own:
      # @OwnerId is only consulted for a method or field already marked @OwnerVisible, so the
      # operations here that do not opt into ownership are unaffected.
      x-klabis-owner-id: true
      schema:
        type: string
        format: uuid

    CategoryPresetIdParam:
      name: id
      in: path
      description: Category preset UUID
      required: true
      schema:
        type: string
        format: uuid

    EventSortParam:
      name: sort
      in: query
      description: |
        Sorting criteria in the format: property,(asc|desc). Allowed fields: id, name, eventDate,
        location, organizer, status, registrationDeadline.
      required: false
      schema:
        type: array
        default: [eventDate,DESC]
        items:
          type: string

  schemas:

    EventStatus:
      type: string
      enum: [DRAFT, ACTIVE, FINISHED, CANCELLED]

    EventSummaryDto:
      type: object
      description: |
        Event summary for list views. The status field is only visible to callers with
        EVENTS:MANAGE authority.
      properties:
        id:
          type: string
          format: uuid
          x-klabis-halforms-access: READ_ONLY
        name:
          type: string
        eventDate:
          type: string
          format: date
        location:
          type: string
        organizer:
          type: string
        websiteUrl:
          type: string
        coordinators:
          type: array
          items:
            type: string
            format: uuid
        eventTypeId:
          type: string
          format: uuid
        status:
          allOf:
            - $ref: '#/components/schemas/EventStatus'
          x-klabis-authority: EVENTS_MANAGE
          x-klabis-halforms-access: READ_ONLY
        categories:
          type: array
          items:
            $ref: '#/components/schemas/EventCategoryDto'
        cancellationReason:
          type: string
          x-klabis-halforms-access: READ_ONLY
        deadlines:
          type: array
          items:
            type: string
            format: date
          x-klabis-halforms-access: READ_ONLY
        sharedTransportEnabled:
          type: boolean
          description: Whether the event offers shared transport members can opt into at registration.
        sharedAccommodationEnabled:
          type: boolean
          description: Whether the event offers shared accommodation members can opt into at registration.

    EventCategoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        fee:
          $ref: '#/components/schemas/EntryFeeDto'

    EntryFeeDto:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string

    EventDto:
      type: object
      description: Complete event information for display purposes.
      properties:
        id:
          type: string
          format: uuid
          x-klabis-halforms-access: READ_ONLY
        name:
          type: string
        eventDate:
          type: string
          format: date
        location:
          type: string
        organizer:
          type: string
        websiteUrl:
          type: string
        coordinators:
          type: array
          items:
            type: string
            format: uuid
        eventTypeId:
          type: string
          format: uuid
        status:
          allOf:
            - $ref: '#/components/schemas/EventStatus'
          x-klabis-halforms-access: READ_ONLY
        categories:
          type: array
          items:
            $ref: '#/components/schemas/EventCategoryDto'
        cancellationReason:
          type: string
          x-klabis-halforms-access: READ_ONLY
        deadlines:
          type: array
          items:
            type: string
            format: date
          x-klabis-halforms-access: READ_ONLY
        ranking:
          $ref: '#/components/schemas/RankingDto'
        baseEntryFee:
          $ref: '#/components/schemas/EntryFeeDto'
        sharedTransportEnabled:
          type: boolean
          description: Whether the event offers shared transport members can opt into at registration.
        sharedAccommodationEnabled:
          type: boolean
          description: Whether the event offers shared accommodation members can opt into at registration.
        sharedServicesSummary:
          allOf:
            - $ref: '#/components/schemas/SharedServicesSummaryDto'
          x-klabis-halforms-access: READ_ONLY

    SharedServicesSummaryDto:
      type: object
      description: |
        Per-offer counts of registered members who opted into a shared service. Populated by the
        server only for the event coordinator or callers with EVENTS:REGISTRATIONS, only for ACTIVE
        events, and only while at least one offer is enabled; omitted entirely otherwise. Each
        sub-object is present only when the corresponding offer is enabled.
      properties:
        sharedTransport:
          $ref: '#/components/schemas/SharedServiceCountDto'
        sharedAccommodation:
          $ref: '#/components/schemas/SharedServiceCountDto'

    SharedServiceCountDto:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: Number of registered members who opted into this shared service.

    RankingDto:
      type: object
      properties:
        shortName:
          type: string
        name:
          type: string

    CreateEventRequest:
      type: object
      x-klabis-class-constraint: com.klabis.events.infrastructure.restapi.DeadlinesOrdered
      description: |
        Accepts deadlines as a list of dates (max 3) and coordinators/categories inline. Category
        `id` is never supplied on create — the server always assigns a fresh id. Deadlines must be
        in non-decreasing order.

        Nested category and fee constraints are enforced: the generated record carries `@Valid` on
        `categories`, which the hand-written predecessor lacked. A blank category name used to reach
        the domain and fail its `Assert.hasText` as a 500; a negative fee amount was not checked
        anywhere at all. Both are now a 400 with field errors.
      required: [name, eventDate, organizer]
      properties:
        name:
          type: string
          maxLength: 100
          x-klabis-not-blank: true
        eventDate:
          type: string
          format: date
