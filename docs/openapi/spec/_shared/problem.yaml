# RFC 7807 Problem Details, as produced by Spring's ProblemDetail.
# Error responses use media type application/problem+json.

components:
  schemas:

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
