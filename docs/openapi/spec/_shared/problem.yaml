# RFC 7807 Problem Details, as produced by Spring's ProblemDetail.
# Error responses use media type application/problem+json.

components:
  schemas:

    ProblemDetail:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        field:
          type: string
          description: >
            Request field the error concerns, set on typed errors bound to one form field.
        fieldErrors:
          type: object
          description: Bean validation messages (Czech) by request field name.
          additionalProperties:
            type: string
        errors:
          type: array
          description: Bean validation messages (Czech) not bound to a single field.
          items:
            type: string
        parameterErrors:
          type: array
          description: Bean validation messages (Czech) for request parameters.
          items:
            type: string
        properties:
          type: object
          additionalProperties: {}

    ErrorType:
      type: string
      description: >
        Identifies the kind of error as a relative URI /errors/{error-name}. Parameters the user-facing
        message needs are sent as further top-level properties of the problem detail (named per type below),
        never as identifiers. The Klabis frontend maps each value to a Czech text.
      enum:
        - /errors/validation-failed       # 400, Czech fieldErrors / errors / parameterErrors
        - /errors/invalid-request         # 400, internal checks and errors without their own type
        - /errors/unauthorized            # 401, missing or invalid authentication
        - /errors/forbidden               # 403, missing authority
        - /errors/account-inactive        # 403, deactivated account
        - /errors/not-found               # 404, unknown path or resource without its own type
        - /errors/conflict                # 409, conflict without its own type
        - /errors/concurrent-update       # 409, optimistic locking failure
        - /errors/unexpected              # 500, anything unhandled
        - /errors/voting-deadline-not-in-future  # 400, parameter deadline (ISO date), field votingDeadline
        - /errors/voting-deadline-in-past        # 400, parameter deadline (ISO date), field votingDeadline
        - /errors/duplicate-payment-rule         # 409, parameters eventTypeName, rankingLabel (each left out when the name cannot be resolved)
        - /errors/payment-rule-not-found         # 404, parameters eventTypeName, rankingLabel (each left out when the name cannot be resolved)
        - /errors/payment-rule-value-missing     # 400, parameter ruleType (PERCENTAGE | FIXED_AMOUNT)
        - /errors/negative-payment-rule-percentage  # 400, parameter percent (integer)
        - /errors/active-campaign-exists         # 409, no parameters
        - /errors/campaign-closed                # 409, no parameters
        - /errors/campaign-already-processed     # 409, no parameters
        - /errors/snapshot-frozen                # 400, no parameters
        - /errors/voting-closed                  # 400, no parameters
        - /errors/membership-fee-tier-not-found  # 404, no parameters
        - /errors/membership-fee-group-not-found # 404, no parameters
        - /errors/fee-selection-campaign-not-found  # 404, parameter year (integer) only when the campaign was looked up by year
        # members
        - /errors/member-not-found                      # 404, no parameters
        - /errors/legal-guardian-not-found              # 404, no parameters
        - /errors/email-required                        # 400, field email, no parameters
        - /errors/phone-required                        # 400, field phone, no parameters
        - /errors/address-required                      # 400, field address, no parameters
        - /errors/birth-number-required                 # 400, field birthNumber, no parameters
        - /errors/guardian-required                     # 400, no field, no parameters (guardians are set through their own resource)
        - /errors/birth-number-not-allowed              # 400, field birthNumber, no parameters
        - /errors/invalid-birth-number                  # 400, field birthNumber, no parameters
        - /errors/invalid-bank-account-number           # 400, field bankAccountNumber, no parameters
        - /errors/invalid-email-address                 # 400, field email, no parameters
        - /errors/invalid-phone-number                  # 400, field phone, no parameters
        - /errors/date-of-birth-in-future               # 400, field dateOfBirth, no parameters
        - /errors/medical-course-validity-not-after-completion  # 400, field medicalCourse, no parameters
        - /errors/member-already-suspended              # 400, no parameters
        - /errors/member-already-active                 # 400, no parameters
        - /errors/suspension-blocked                    # 409, parameters groups (object with affectedGroups[groupId, groupName, groupType]) and debt (object with balance{amount, currency} and accountLink); each present only when it blocks
        - /errors/adult-member-cannot-have-guardians    # 400, field legalGuardians, no parameters
        - /errors/minor-cannot-take-over-guardian       # 400, field legalGuardianUserId, no parameters
        - /errors/registration-number-already-in-use    # 400, parameter registrationNumber (string)
        - /errors/account-activation-not-available      # 400, no parameters
        - /errors/legal-guardian-email-already-in-use   # 400, parameter email (string)
        - /errors/guardian-not-found                    # 400, no parameters (the chosen user cannot be a legal guardian)
        - /errors/legal-guardian-group-without-guardian # 400, no parameters
        - /errors/only-minors-allowed                   # 400, no parameters
        # events
        - /errors/event-not-found                       # 404, no parameters
        - /errors/oris-event-not-found                  # 404, parameter orisId (integer)
        - /errors/discipline-not-found                  # 404, no parameters
        - /errors/oris-discipline-not-found             # 404, parameter orisId (string)
        - /errors/event-type-not-found                  # 404, no parameters
        - /errors/category-preset-not-found             # 404, no parameters
        - /errors/registration-not-found                # 404, no parameters
        - /errors/coordinator-not-found                 # 404, no parameters
        - /errors/duplicate-registration                # 409, parameter eventName (string), empty detail
        - /errors/discipline-not-editable               # 409, parameter disciplineName (string)
        - /errors/discipline-not-archived               # 409, parameter disciplineName (string)
        - /errors/oris-discipline-already-mapped        # 409, parameter eventTypeName (string, left out when unknown)
        - /errors/event-type-in-use                     # 409, parameter eventNames (array of strings, at most 5)
        - /errors/event-type-name-already-exists        # 409, parameter name (string), field name
        - /errors/event-sync-needs-resolution           # 409, parameter orisId (integer)
        - /errors/member-registration-blocked           # 400, no parameters
        - /errors/duplicate-category-name               # 400, parameter categoryName (string)
        - /errors/duplicate-category-oris-id            # 400, no parameters
        - /errors/registration-deadline-after-event-date  # 400, field deadlines, no parameters
        - /errors/finished-event-cannot-be-updated      # 400, no parameters
        - /errors/cancelled-event-cannot-be-updated     # 400, no parameters
        - /errors/category-required                     # 400, field categoryId, no parameters
        - /errors/category-not-available                # 400, field categoryId, no parameters
        - /errors/event-not-active-for-registration     # 400, no parameters
        - /errors/registration-deadline-passed          # 400, no parameters
        - /errors/registration-closed-after-event-date  # 400, no parameters
        - /errors/si-card-rental-not-allowed            # 400, field wantsToRentSi, no parameters
        - /errors/si-card-number-required               # 400, field siCardNumber, no parameters
        - /errors/invalid-event-status-transition       # 400, parameters from, to (event status codes DRAFT | ACTIVE | FINISHED | CANCELLED)
        - /errors/unknown-event-category                # 400, no parameters
        - /errors/invalid-oris-registration-deadlines   # 400, parameter orisId (integer)
        - /errors/accommodation-list-access-denied      # 403, no parameters
        - /errors/shared-accommodation-not-offered      # 403, no parameters
        # calendar
        - /errors/calendar-item-not-found               # 404, no parameters
        - /errors/calendar-item-read-only               # 400, no parameters
        - /errors/calendar-item-end-before-start        # 400, field endDate, no parameters
        - /errors/date-range-too-long                   # 400, parameter maxDays (integer)
        # finance
        - /errors/overdraft-limit-exceeded              # 422, parameters memberName (string, left out when unknown), chargeAmount, currentBalance, overdraftLimit (each {amount: number, currency: string})
        - /errors/transaction-already-reversed          # 409, parameters memberName (string, left out when unknown), amount ({amount: number, currency: string}, the reversed transaction)
        - /errors/member-account-not-found              # 404, parameter memberName (string, left out when unknown)
        - /errors/transaction-not-found                 # 404, parameter memberName (string, left out when unknown)
        # groups
        - /errors/group-not-found                       # 404, no parameters
        - /errors/cannot-remove-last-owner              # 422, parameters groupName (string), memberName (string, left out when unknown)
        - /errors/direct-member-addition-not-allowed    # 422, parameter groupName (string)
        - /errors/owner-cannot-be-member                # 422, parameters groupName (string), memberName (string, left out when unknown)
        - /errors/member-already-in-group               # 400, parameters groupName (string), memberName (string, left out when unknown)
        - /errors/member-not-in-group                   # 400, parameters groupName (string), memberName (string, left out when unknown)
        - /errors/group-ownership-required              # 403, parameter groupName (string)
        - /errors/not-invited-member                    # 400, parameter groupName (string)
        - /errors/cannot-invite-existing-member         # 400, field memberId, parameters groupName (string), memberName (string, left out when unknown)
        - /errors/duplicate-pending-invitation          # 400, field memberId, parameters groupName (string), memberName (string, left out when unknown)
        - /errors/cannot-promote-non-member-to-owner    # 409, field memberId, parameters groupName (string), memberName (string, left out when unknown)
        - /errors/invitation-not-cancellable            # 409, parameter invitationStatus (ACCEPTED | REJECTED | CANCELLED)
        - /errors/invitation-not-found                  # 404, no parameters
        - /errors/member-already-in-training-group      # 409, field memberId, parameters groupName (the group the member already trains in), memberName (string, left out when unknown)
        - /errors/trainer-required                      # 400 (was 422 as the unmigrated last-owner error; intended), field trainers, parameter groupName (string, only when raised by the group itself)
        - /errors/invalid-age-range                     # 400, parameters minAge, maxAge (integers, maxAge below minAge)
        - /errors/overlapping-age-range                 # 400, parameters minAge, maxAge (integers, the refused range)
        # common/users
        - /errors/user-not-found                        # 404, no parameters
        - /errors/cannot-remove-last-permission-manager # 409, no parameters
        - /errors/admin-lockout                         # 409, no parameters
        - /errors/invalid-authority                     # 400, parameter authority (string, the refused authority value)
        - /errors/incorrect-current-password            # 400, field currentPassword, no parameters
        - /errors/passwords-do-not-match                # 400, field passwordConfirmation, no parameters
        - /errors/password-requirements-not-met         # 400, parameters violations (array of REQUIRED | TOO_SHORT | MISSING_UPPERCASE | MISSING_LOWERCASE | MISSING_DIGIT | MISSING_SPECIAL_CHARACTER | CONTAINS_FIRST_NAME | CONTAINS_LAST_NAME | CONTAINS_REGISTRATION_NUMBER), minLength (integer)
        - /errors/invalid-token                         # 400, no parameters (unknown token, unknown user, account not awaiting activation)
        - /errors/token-expired                         # 410, no parameters
        - /errors/token-already-used                    # 410, no parameters
        - /errors/insufficient-authority                # 403, no parameters
        - /errors/member-profile-required               # 403, no parameters
        - /errors/rate-limit-exceeded                   # 429, no parameters (Retry-After header)
        # sync, notifications
        - /errors/sync-record-needs-resolution          # 409, parameter syncStatus (CONFLICT | FAILED | RETRYING | ...)
        - /errors/sync-record-not-in-conflict           # 409, no parameters
        - /errors/conflict-not-acknowledged             # 409, no parameters
        - /errors/sync-record-not-failed                # 409, no parameters
        - /errors/sync-record-claimed                   # 409, no parameters (another synchronisation pass holds the record)
        - /errors/unsupported-resolution                # 409, parameter resolution (INWARD | OUTWARD | ACCEPT_DIVERGENCE)
        - /errors/sync-record-not-found                 # 404, no parameters
        - /errors/sync-record-not-enrolled              # 404, no parameters
        - /errors/notification-device-not-found         # 404, no parameters
        # closing sweep (every subclass of the five common bases)
        - /errors/field-authorization                   # 403, field = the request property the caller may not write, no parameters
        - /errors/authority-not-grantable-over-all      # 400, parameter authorities (array of authority codes)
        - /errors/invalid-delegated-authority           # 400, parameter authority (authority code)
        - /errors/unknown-sync-entity-type              # 400, parameters entityType (EVENT | DISCIPLINE | MEMBER | EVENT_REGISTRATION), externalSystem (ORIS)
