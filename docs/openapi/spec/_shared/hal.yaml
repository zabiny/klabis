# HAL and HAL+FORMS building blocks.
#
# These describe the *media type*, not the Klabis API — they follow the HAL spec
# (https://stateless.co/hal_specification.html) and the HAL-FORMS extension
# (http://rwcbook.com/hal-forms/). Keep them aligned with the standard, not with
# whatever a particular endpoint happens to return.
#
# The frontend counterpart lives in frontend/src/api/halRuntime.ts.

components:
  schemas:

    Link:
      type: object
      required: [href]
      properties:
        href:
          type: string
        hreflang:
          type: string
        title:
          type: string
        type:
          type: string
        deprecation:
          type: string
        profile:
          type: string
        name:
          type: string
        templated:
          type: boolean

    Links:
      description: |
        Map of link relation name to a link (or array of links).
        Which relations appear is authorization-dependent — see x-hal-links on each response.
      type: object
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/Link'
          - type: array
            items:
              $ref: '#/components/schemas/Link'

    PageMetadata:
      type: object
      required: [size, totalElements, totalPages, number]
      properties:
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
          format: int64

    HalFormsOptionItem:
      type: object
      required: [value]
      properties:
        value:
          oneOf:
            - type: string
            - type: number
        prompt:
          type: string

    HalFormsOptions:
      description: http://rwcbook.com/hal-forms/#options-element
      type: object
      properties:
        inline:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/HalFormsOptionItem'
              - type: string
              - type: number
        link:
          $ref: '#/components/schemas/Link'

    HalFormsProperty:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        prompt:
          type: string
        type:
          description: text, number, email, date, textarea, radioGroup, checkboxGroup, …
          type: string
        value:
          oneOf:
            - type: string
            - type: number
        required:
          type: boolean
        regex:
          type: string
        readOnly:
          type: boolean
        options:
          $ref: '#/components/schemas/HalFormsOptions'
        suggest:
          $ref: '#/components/schemas/HalFormsOptions'
        multiple:
          type: boolean
        multi:
          description: |
            Non-standard shorthand currently emitted by HalFormsSupport instead of `multiple`.
            Tracked as a backend defect; kept here so the spec matches what is actually sent.
          type: boolean
        min:
          type: number
        max:
          type: number
        minLength:
          type: integer
        maxLength:
          type: integer

    HalFormsTemplate:
      type: object
      required: [properties]
      properties:
        method:
          type: string
          enum: [POST, PUT, PATCH, DELETE]
        target:
          type: string
        contentType:
          type: string
        title:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/HalFormsProperty'

    HalFormsTemplates:
      description: |
        Map of template name to template. Which templates appear is authorization- and
        state-dependent — see x-hal-templates on each response.
      type: object
      additionalProperties:
        $ref: '#/components/schemas/HalFormsTemplate'
