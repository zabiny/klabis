openapi: 3.1.0

info:
  title: Klabis Orienteering Club Management API
  description: |
    RESTful API for managing orienteering club operations.

    ## Features
    - Member registration and management
    - HATEOAS-compliant with HAL+FORMS media type
    - OAuth2 authentication and authorization
    - RFC 7807 Problem Details for errors

    ## Authentication
    Most endpoints require OAuth2 authentication. Use the 'Authorize' button to authenticate.
  contact:
    name: Klabis Development Team
    email: davca7@gmail.com
  license:
    name: Proprietary
    url: https://github.com/zabiny/klabis/blob/main/LICENCE
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://api.klabis.com
    description: Production server

# Module specs are $ref'd in here as they are migrated.
paths:
  /api/members:
    $ref: './members.yaml#/paths/~1api~1members'
  /api/members/options:
    $ref: './members.yaml#/paths/~1api~1members~1options'
  /api/members/{id}:
    $ref: './members.yaml#/paths/~1api~1members~1{id}'
  /api/members/{id}/suspend:
    $ref: './members.yaml#/paths/~1api~1members~1{id}~1suspend'
  /api/members/{id}/resume:
    $ref: './members.yaml#/paths/~1api~1members~1{id}~1resume'
  /api/event-types:
    $ref: './event-types.yaml#/paths/~1api~1event-types'
  /api/event-types/{id}:
    $ref: './event-types.yaml#/paths/~1api~1event-types~1{id}'
  /api/events:
    $ref: './events.yaml#/paths/~1api~1events'
  /api/events/{id}:
    $ref: './events.yaml#/paths/~1api~1events~1{id}'
  /api/events/{id}/publish:
    $ref: './events.yaml#/paths/~1api~1events~1{id}~1publish'
  /api/events/{id}/cancel:
    $ref: './events.yaml#/paths/~1api~1events~1{id}~1cancel'
  /api/events/{eventId}/accommodation-list:
    $ref: './events.yaml#/paths/~1api~1events~1{eventId}~1accommodation-list'
  /api/events/import:
    $ref: './events.yaml#/paths/~1api~1events~1import'
  /api/events/{id}/sync-from-oris:
    $ref: './events.yaml#/paths/~1api~1events~1{id}~1sync-from-oris'
  /api/events/sync-from-oris/all-upcoming:
    $ref: './events.yaml#/paths/~1api~1events~1sync-from-oris~1all-upcoming'
  /api/events/import-batch:
    $ref: './events.yaml#/paths/~1api~1events~1import-batch'
  /api/events/{eventId}/registrations:
    $ref: './events.yaml#/paths/~1api~1events~1{eventId}~1registrations'
  /api/events/{eventId}/registrations/{memberId}:
    $ref: './events.yaml#/paths/~1api~1events~1{eventId}~1registrations~1{memberId}'
  /api/category-presets:
    $ref: './events.yaml#/paths/~1api~1category-presets'
  /api/category-presets/{id}:
    $ref: './events.yaml#/paths/~1api~1category-presets~1{id}'
  # /api/members/{memberId}/account* looks like a members path but is served by the finance
  # module's controller — registered here, not in members.yaml. See finance.yaml header comment.
  /api/members/{memberId}/account:
    $ref: './finance.yaml#/paths/~1api~1members~1{memberId}~1account'
  /api/members/{memberId}/account/transactions:
    $ref: './finance.yaml#/paths/~1api~1members~1{memberId}~1account~1transactions'
  /api/members/{memberId}/account/transactions/charge:
    $ref: './finance.yaml#/paths/~1api~1members~1{memberId}~1account~1transactions~1charge'
  /api/members/{memberId}/account/transactions/{txId}:
    $ref: './finance.yaml#/paths/~1api~1members~1{memberId}~1account~1transactions~1{txId}'
  /api/members/{memberId}/account/transactions/{txId}/reverse:
    $ref: './finance.yaml#/paths/~1api~1members~1{memberId}~1account~1transactions~1{txId}~1reverse'
  /api/calendar-items:
    $ref: './calendar.yaml#/paths/~1api~1calendar-items'
  /api/calendar-items/{id}:
    $ref: './calendar.yaml#/paths/~1api~1calendar-items~1{id}'
  /api/me/ical-token:
    $ref: './calendar.yaml#/paths/~1api~1me~1ical-token'
  # Outside /api/ and not HAL: text/calendar feed authenticated by a ?token= query parameter.
  /ical/my-schedule.ics:
    $ref: './calendar.yaml#/paths/~1ical~1my-schedule.ics'

components:
  securitySchemes:
    KlabisAuth:
      type: oauth2
      description: OAuth2 authentication with Klabis Authorization Server
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: authenticate
            profile: display user profile information
            MEMBERS: Members
            EVENTS: Events

  schemas: {}
