# Event types module — the API surface of EventTypeController (events module).
#
# The event type catalog is a small, unpaginated reference list: listEventTypes returns a
# CollectionModel, not a PagedModel.

paths:

  /api/event-types:
    get:
      operationId: listEventTypes
      tags: [EventTypes]
      summary: List all event types
      description: Returns all event types sorted by sort order.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_READ
      responses:
        '200':
          description: List of event types
          content:
            application/prs.hal-forms+json:
              schema:
                $ref: '#/components/schemas/CollectionModelEntityModelEventTypeDto'
          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            createEventType:
              operation: createEventType
              description: |
                Present only for callers with EVENTS:MANAGE. The orisDisciplineIds property is
                populated at runtime with the available ORIS discipline options.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    post:
      operationId: createEventType
      tags: [EventTypes]
      summary: Create an event type
      description: Creates a new event type. When sortOrder is omitted it is assigned automatically.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventTypeRequest'
      responses:
        '201':
          description: Event type created
          headers:
            Location:
              description: URI of the created event type
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/event-types/{id}:
    get:
      operationId: getEventType
      tags: [EventTypes]
      summary: Get event type by ID
      description: Returns a single event type.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_READ
      parameters:
        - $ref: '#/components/parameters/EventTypeIdParam'
      responses:
        '200':
          description: Event type found
          content:
            application/prs.hal-forms+json:
              schema:
                $ref: '#/components/schemas/EntityModelEventTypeDto'
          x-hal-links:
            self:
              description: This event type
            collection:
              operation: listEventTypes
              description: Back to the event type list
          x-hal-templates:
            default:
              operation: updateEventType
              description: |
                Present only for callers with EVENTS:MANAGE. The orisDisciplineIds property is
                populated at runtime with the available ORIS discipline options.
            deleteEventType:
              operation: deleteEventType
              description: Present only for callers with EVENTS:MANAGE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    put:
      operationId: updateEventType
      tags: [EventTypes]
      summary: Update an event type
      description: Updates an existing event type.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      parameters:
        - $ref: '#/components/parameters/EventTypeIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventTypeRequest'
      responses:
        '204':
          description: Event type updated
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteEventType
      tags: [EventTypes]
      summary: Delete an event type
      description: Deletes an event type that is not in use by any event.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      parameters:
        - $ref: '#/components/parameters/EventTypeIdParam'
      responses:
        '204':
          description: Event type deleted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:

  parameters:
    EventTypeIdParam:
      name: id
      in: path
      description: Event type UUID
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request - invalid argument
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict - concurrent update (optimistic locking failure)
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Unprocessable entity - request violates a business rule
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'

  schemas:

    # Envelope schemas — never generated into Java; the backend generator emits only the payload.
    #
    # The response references the true wire shape (the HAL object with _embedded), and
    # schemaMappings redirects it to a plain java.util.List<EventTypeDto> in the generated
    # signature — that List is what the controller hands to HalResponseBodyAdvice, which builds the
    # CollectionModel described here. Same split as PagedModel*/Page<T> for paged endpoints.
    CollectionModelEntityModelEventTypeDto:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            eventTypeDtoList:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelEventTypeDto'
        _links:
          $ref: './_shared/hal.yaml#/components/schemas/Links'
        _templates:
          $ref: './_shared/hal.yaml#/components/schemas/HalFormsTemplates'

    EntityModelEventTypeDto:
      allOf:
        - $ref: '#/components/schemas/EventTypeDto'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'
            _templates:
              $ref: './_shared/hal.yaml#/components/schemas/HalFormsTemplates'

    EventTypeDto:
      type: object
      description: Event type catalog entry.
      properties:
        id:
          type: string
          format: uuid
          x-klabis-halforms-access: READ_ONLY
        name:
          type: string
        color:
          type: string
          description: Hex color code used to render the event type in the UI.
          pattern: '^#[0-9a-fA-F]{6}$'
        sortOrder:
          type: integer
          format: int32
        orisDisciplineIds:
          type: array
          description: ORIS discipline identifiers mapped onto this event type.
          uniqueItems: true
          items:
            type: integer
            format: int32

    CreateEventTypeRequest:
      type: object
      description: Event type creation data
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        sortOrder:
          type: integer
          format: int32
          description: Assigned automatically when omitted.
          minimum: 0
        orisDisciplineIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32

    UpdateEventTypeRequest:
      type: object
      description: Event type update data
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        sortOrder:
          type: integer
          format: int32
          description: Left unchanged when omitted.
          minimum: 0
        orisDisciplineIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32
