# Event types module — the API surface of EventTypeController (events module).
#
# The event type catalog is a small, unpaginated reference list: listEventTypes returns a
# CollectionModel, not a PagedModel.

# Standalone OpenAPI document: this file renders on its own in Swagger UI / Redoc, served
# from this directory so its ./_shared/*.yaml refs resolve. info is duplicated from
# klabis.yaml rather than shared, because $ref cannot target a document's own info; the
# bundler ignores both keys (modules are pulled in by #/paths/... pointer, never whole-file)
# and validate.mjs pins version to the root's so the two cannot drift.
openapi: 3.1.0

info:
  title: Klabis API — Event types module
  description: The Event types slice of the Klabis API. See klabis.yaml for the full API.
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://api.klabis.com
    description: Production server

paths:

  /api/event-types:
    get:
      operationId: listEventTypes
      tags: [EventTypes]
      summary: List all event types
      description: Returns all event types sorted by sort order.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_READ
      responses:
        '200':
          description: List of event types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeDtoList'
            application/prs.hal-forms+json:
              schema:
                $ref: '#/components/schemas/CollectionModelEntityModelEventTypeDto'
          x-hal-links:
            self:
              description: This collection
          x-hal-templates:
            createEventType:
              operation: createEventType
              description: |
                Present only for callers with EVENTS:MANAGE. The orisDisciplineIds property is
                populated at runtime with the available ORIS discipline options.
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: createEventType
      tags: [EventTypes]
      summary: Create an event type
      description: Creates a new event type. When sortOrder is omitted it is assigned automatically.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventTypeRequest'
      responses:
        '201':
          description: Event type created
          headers:
            Location:
              description: URI of the created event type
              schema:
                type: string
                format: uri
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/event-types/{id}:
    get:
      operationId: getEventType
      tags: [EventTypes]
      summary: Get event type by ID
      description: Returns a single event type.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_READ
      parameters:
        - $ref: '#/components/parameters/EventTypeIdParam'
      responses:
        '200':
          description: Event type found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeDto'
            application/prs.hal-forms+json:
              schema:
                $ref: '#/components/schemas/EntityModelEventTypeDto'
          x-hal-links:
            self:
              description: This event type
            collection:
              operation: listEventTypes
              description: Back to the event type list
          x-hal-templates:
            default:
              operation: updateEventType
              description: |
                Present only for callers with EVENTS:MANAGE. The orisDisciplineIds property is
                populated at runtime with the available ORIS discipline options.
            deleteEventType:
              operation: deleteEventType
              description: Present only for callers with EVENTS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    put:
      operationId: updateEventType
      tags: [EventTypes]
      summary: Update an event type
      description: Updates an existing event type.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      parameters:
        - $ref: '#/components/parameters/EventTypeIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventTypeRequest'
      responses:
        '204':
          description: Event type updated
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteEventType
      tags: [EventTypes]
      summary: Delete an event type
      description: Deletes an event type that is not in use by any event.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      parameters:
        - $ref: '#/components/parameters/EventTypeIdParam'
      responses:
        '204':
          description: Event type deleted
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    KlabisAuth:
      type: oauth2
      description: OAuth2 authentication with Klabis Authorization Server
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: authenticate
            profile: display user profile information
            MEMBERS: Members
            EVENTS: Events

  parameters:
    EventTypeIdParam:
      name: id
      in: path
      description: Event type UUID
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    # Named so schemaMappings can retarget it onto Collection<EventTypeDto> — an inline array has no
    # schema name to map from, and the generator would otherwise infer List<EventTypeDto> straight
    # from this application/json sibling (it wins type resolution over the emptied HAL schema).
    EventTypeDtoList:
      type: array
      items:
        $ref: '#/components/schemas/EventTypeDto'

    # Envelope schemas — never generated into Java; the backend generator emits only the payload.
    #
    # The response references the true wire shape (the HAL object with _embedded), and
    # schemaMappings redirects it to a plain java.util.Collection<EventTypeDto> in the generated
    # signature — that Collection is what the controller hands to HalResponseBodyAdvice, which builds
    # the CollectionModel described here. Same split as PagedModel*/Page<T> for paged endpoints.
    CollectionModelEntityModelEventTypeDto:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            eventTypeDtoList:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelEventTypeDto'
        _links:
          $ref: './_shared/hal.yaml#/components/schemas/Links'
        _templates:
          $ref: './_shared/hal.yaml#/components/schemas/HalFormsTemplates'

    EntityModelEventTypeDto:
      allOf:
        - $ref: '#/components/schemas/EventTypeDto'
        - type: object
          properties:
            _links:
              $ref: './_shared/hal.yaml#/components/schemas/Links'
            _templates:
              $ref: './_shared/hal.yaml#/components/schemas/HalFormsTemplates'

    EventTypeDto:
      type: object
      description: Event type catalog entry.
      properties:
        id:
          type: string
          format: uuid
          x-klabis-halforms-access: READ_ONLY
        name:
          type: string
        color:
          type: string
          description: Hex color code used to render the event type in the UI.
          pattern: '^#[0-9a-fA-F]{6}$'
        sortOrder:
          type: integer
          format: int32
        orisDisciplineIds:
          type: array
          description: ORIS discipline identifiers mapped onto this event type.
          uniqueItems: true
          items:
            type: integer
            format: int32

    CreateEventTypeRequest:
      type: object
      description: Event type creation data
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        sortOrder:
          type: integer
          format: int32
          description: Assigned automatically when omitted.
          minimum: 0
        orisDisciplineIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32

    UpdateEventTypeRequest:
      type: object
      description: Event type update data
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        sortOrder:
          type: integer
          format: int32
          description: Left unchanged when omitted.
          minimum: 0
        orisDisciplineIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32
