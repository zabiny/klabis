# Members module — the API surface of MemberController plus registerMember (RegistrationController),
# which is exposed as an affordance on the member collection.
#
# Legal guardian groups (LegalGuardianGroupController, /api/legal-guardian-groups) belong to the members module too: the
# members module owns the guardian/minor relation (e.g. suspension blockers), so their API lives here.
#
# Endpoints living under /api/members/{memberId}/... that belong to other modules
# (finance accounts, fee choices, fee summaries) are NOT part of this file.

# Standalone OpenAPI document: this file renders on its own in Swagger UI / Redoc, served
# from this directory so its ./_shared/*.yaml refs resolve. info is duplicated from
# klabis.yaml rather than shared, because $ref cannot target a document's own info; the
# bundler ignores both keys (modules are pulled in by #/paths/... pointer, never whole-file)
# and validate.mjs pins version to the root's so the two cannot drift.
openapi: 3.1.0

info:
  title: Klabis API — Members module
  description: The Members slice of the Klabis API. See klabis.yaml for the full API.
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://api.klabis.com
    description: Production server

paths:

  /api/members:
    get:
      operationId: listMembers
      tags: [Members]
      summary: List members with pagination and sorting
      description: |
        Paginated list of members with summary information. Supports fulltext search and status
        filtering. Callers without MEMBERS:MANAGE are silently restricted to active members, and
        the admin-only fields (email, active) are omitted from the response.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_READ
      x-spring-paginated: true
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.members.CurrentUserData currentUser'
      parameters:
        - $ref: './_shared/pagination.yaml#/components/parameters/PageParam'
        - $ref: './_shared/pagination.yaml#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: q
          in: query
          description: Fulltext search over firstName, lastName, registrationNumber (min 2 chars)
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 'Status filter: ACTIVE, INACTIVE, ALL. Non-MANAGE callers are silently forced to ACTIVE.'
          required: false
          schema:
            type: string
        - name: incomplete
          in: query
          description: 'When true, restricts results to members with incomplete data. Ignored for callers without MEMBERS:MANAGE.'
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of members retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberSummaryResponse'
          x-hal-links:
            self:
              description: This collection, with the current paging and filter parameters
            first:
              description: First page (present when the result is paged)
            last:
              description: Last page (present when the result is paged)
            next:
              description: Next page (present when one exists)
            prev:
              description: Previous page (present when one exists)
          x-hal-templates:
            updateMember:
              operation: updateMember
              description: Edit template used by the table's inline row editor
            registerMember:
              operation: registerMember
              description: Present only for callers with MEMBERS:MANAGE
            importFromOris:
              operation: importFromOris
              description: |
                Present only for callers with SYNC:MANAGE and only while a club key is held —
                without one the action could not do anything (design.md D11).
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    post:
      operationId: registerMember
      tags: [Registration]
      summary: Register a new member
      description: |
        Creates a new member with personal information and contact details. Generates a unique registration number in format XXXYYSS
        (club code, birth year, sequence).

        Responds with a Location header pointing at the created member. When the birth number is
        inconsistent with the other personal data, warnings are returned in the X-Warnings header
        — the member is still created.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.common.users.UserId currentUserId'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '201':
          description: Member successfully registered
          headers:
            Location:
              description: URI of the created member
              schema:
                type: string
                format: uri
            X-Warnings:
              description: Birth number consistency warnings, if any
              schema:
                type: array
                items:
                  type: string
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/options:
    get:
      operationId: listMemberOptions
      tags: [Members]
      summary: List members as select options
      description: Lightweight value/prompt pairs for member picker components.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_READ
      responses:
        '200':
          description: Member options retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberOptionResponse'
            application/prs.hal-forms+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberOptionResponse'
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/oris-import:
    post:
      operationId: importFromOris
      tags: [Members]
      summary: Run the ORIS member import once, by hand
      description: |
        Runs the same discovery work as the scheduled ORIS member discovery job immediately,
        rather than waiting for its next run (design.md D11). Offered as an affordance on
        listMembers only while a club key is held — without one the action could not do
        anything. Running it repeatedly brings nobody in twice: an already-paired member is
        skipped exactly as the scheduled job skips it.
      security:
        - KlabisAuth: [SYNC]
      x-klabis-authority: SYNC_MANAGE
      responses:
        '204':
          description: Import pass completed
          content:
            application/prs.hal-forms+json: {}
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'

  /api/members/{id}:
    get:
      operationId: getMember
      tags: [Members]
      summary: Get member by ID
      description: |
        Detailed member information. Which fields are present depends on the caller: fields marked
        with x-klabis-authority / x-klabis-owner-visible are omitted unless the caller holds
        MEMBERS:MANAGE or MEMBERS:EDIT_PROFILE over this member, or is the member themselves.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_READ
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.members.CurrentUserData currentUser'
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      responses:
        '200':
          description: Member found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetailsResponse'
          x-hal-links:
            self:
              description: This member
            collection:
              operation: listMembers
              description: Back to the member list
            permissions:
              description: Member's permissions (requires MEMBERS:PERMISSIONS)
            account:
              description: Member's finance account (requires FINANCE:MANAGE or ownership)
            feeSummary:
              description: Membership fee summary for the current year
            legalGuardianGroup:
              description: Legal guardian group of a minor member, present only for callers with MEMBERS:MANAGE
            legalGuardians:
              operation: listLegalGuardianGroupGuardians
              description: |
                Legal guardians of a minor who belongs to a legal guardian group; present for callers with
                MEMBERS:MANAGE, for the minor themself and for holders of MEMBERS:EDIT_PROFILE over a minor
                of the group (the minor's legal guardians). Absent for adults and for minors without a group.
            trainingGroup:
              description: Training group the member belongs to, when there is one
            ical-token:
              description: Calendar subscription token — only on the caller's own detail
            sync:
              operation: getSyncState
              description: |
                Present when the member was brought in from ORIS and the caller has SYNC:MANAGE
                (design.md D12) — the same authority getSyncState itself requires. Absent for a
                member never paired with ORIS.
          x-hal-templates:
            updateMember:
              operation: updateMember
            suspend:
              operation: suspendMember
              description: Present only while the member is active
            resume:
              operation: resumeMember
              description: Present only while the member is suspended
            setMemberLegalGuardians:
              operation: setMemberLegalGuardians
              description: Present only for a minor and for callers with MEMBERS:MANAGE
            sendMemberAccountActivation:
              operation: sendMemberAccountActivation
              description: |
                Present only for a minor with an own e-mail whose account still awaits activation and
                for callers with MEMBERS:MANAGE
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    patch:
      operationId: updateMember
      tags: [Members]
      summary: Update member details
      description: |
        Partial update — only the fields present in the request body are changed. Each field is a
        JsonNullable wrapper, so omitting a field and setting it to null are different operations.
        Fields the caller is not authorized to change are rejected.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.members.CurrentUserData currentUser'
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '204':
          description: Member updated successfully
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/{id}/suspend:
    post:
      operationId: suspendMember
      tags: [Members]
      summary: Suspend a membership
      description: |
        Suspends an active membership. Refused when the member still has outstanding debt on their
        finance account, or when they are the sole owner of at least one group — a successor must
        be designated first.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.common.users.UserId currentUserId'
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendMembershipRequest'
      responses:
        '204':
          description: Membership suspended
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          # MembersExceptionHandler answers both suspension blockers with a bespoke JSON body
          # carrying the data the caller needs to resolve them, not with a ProblemDetail — hence
          # the local response instead of the shared #/components/responses/Conflict.
          description: |
            Suspension is blocked — either the member owes money on their finance account, or they
            are the sole owner of at least one group.
          content:
            # application/json, not the hal-forms/problem+json this operation otherwise produces:
            # the body comes from a @RestControllerAdvice handler returning a plain record, which
            # is not bound by the handler method's own produces list.
            application/json:
              schema:
                $ref: '#/components/schemas/SuspensionBlockedWarning'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/{id}/resume:
    post:
      operationId: resumeMember
      tags: [Members]
      summary: Resume a suspended membership
      description: |
        Reactivates a suspended membership. Refused when the membership is already active.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.common.users.UserId currentUserId'
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      responses:
        '204':
          description: Membership resumed
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/members/{id}/account-activation:
    post:
      operationId: sendMemberAccountActivation
      tags: [MemberAccountActivation]
      summary: Send an activation link to a minor's own e-mail
      description: |
        Lets an administrator decide that a minor gets their own login: generates a password setup
        token and sends the activation link to the minor's own e-mail. Refused unless the member is a
        minor with an own e-mail and an account awaiting activation. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      responses:
        '204':
          description: Activation link sent
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'

  /api/members/{id}/legal-guardians:
    put:
      operationId: setMemberLegalGuardians
      tags: [LegalGuardianGroups]
      summary: Set the legal guardians of a minor
      description: |
        Replaces the complete list of legal guardians of a minor member. Each item is either an
        existing guardian chosen by user id or a new non-member guardian entered in place; a new
        guardian is created in the same transaction. The minor moves to the legal guardian group with
        exactly these guardians (created when there is none); siblings keep their guardians. The list
        must not be empty and the member must be younger than 18. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/MemberIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLegalGuardiansRequest'
      responses:
        '204':
          description: Legal guardians set
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------------------------------------
  # LegalGuardianGroups (LegalGuardianGroupController, /api/legal-guardian-groups)
  # Groups are created, merged and removed automatically as the guardians of minors change, so
  # there is no create/delete endpoint.
  # ---------------------------------------------------------------------------------------------

  /api/legal-guardian-groups:
    get:
      operationId: listLegalGuardianGroups
      tags: [LegalGuardianGroups]
      summary: List all legal guardian groups
      description: Returns all legal guardian groups ordered by name, each with its guardians and number of minors. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      responses:
        '200':
          description: List of legal guardian groups retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalGuardianGroupSummaryResponse'
          x-hal-links:
            self:
              description: This collection
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/legal-guardian-groups/{id}:
    get:
      operationId: getLegalGuardianGroup
      tags: [LegalGuardianGroups]
      summary: Get legal guardian group details
      description: |
        Returns legal guardian group details including its minors with their own hypermedia links;
        the guardians are behind the legalGuardians link. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/LegalGuardianGroupIdParam'
      responses:
        '200':
          description: Legal guardian group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalGuardianGroupResponse'
          x-hal-links:
            self:
              description: This legal guardian group
            collection:
              operation: listLegalGuardianGroups
              description: Back to the group list
            legalGuardians:
              operation: listLegalGuardianGroupGuardians
              description: Guardians of the group
          x-hal-templates:
            setLegalGuardianGroupGuardians:
              operation: setLegalGuardianGroupGuardians
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/legal-guardian-groups/{id}/guardians:
    get:
      operationId: listLegalGuardianGroupGuardians
      tags: [LegalGuardianGroups]
      summary: List the guardians of a legal guardian group
      description: |
        Guardians of the group with their contacts; each item links to the guardian's member detail
        (member) or non-member profile (legalGuardian). Requires MEMBERS:MANAGE, being a minor of the
        group, or holding MEMBERS:EDIT_PROFILE over a minor of the group.
      security:
        - KlabisAuth: [MEMBERS]
      x-spring-provide-args:
        - '@com.klabis.common.users.ActingUser com.klabis.members.CurrentUserData currentUser'
      parameters:
        - $ref: '#/components/parameters/LegalGuardianGroupIdParam'
      responses:
        '200':
          description: Guardians of the group retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalGuardianGroupGuardianResponse'
          x-hal-links:
            self:
              description: This collection
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/legal-guardian-groups/{id}/legal-guardians:
    put:
      operationId: setLegalGuardianGroupGuardians
      tags: [LegalGuardianGroups]
      summary: Set the guardians of a legal guardian group
      description: |
        Replaces the complete set of guardians for all minors of the group. When another group already
        has exactly this set of guardians, the minors join it and this group disappears. The set must
        not be empty. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - $ref: '#/components/parameters/LegalGuardianGroupIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLegalGuardiansRequest'
      responses:
        '204':
          description: Guardians set
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------------------------------------
  # LegalGuardians (LegalGuardianController, /api/legal-guardians) - non-member legal guardians
  # and the candidates offered when choosing guardians (/api/legal-guardian-options).
  # A legal guardian is created together with the minor's guardians, not through a POST here.
  # ---------------------------------------------------------------------------------------------

  /api/legal-guardians/{userId}:
    get:
      operationId: getLegalGuardian
      tags: [LegalGuardians]
      summary: Get the profile of a non-member legal guardian
      description: |
        Profile of a non-member legal guardian including the login number (EXTnnnn). Visible to users
        with MEMBERS:MANAGE and to the guardian themself.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      x-klabis-owner-visible: true
      parameters:
        - $ref: '#/components/parameters/LegalGuardianUserIdParam'
      responses:
        '200':
          description: Legal guardian found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalGuardianResponse'
          x-hal-links:
            self:
              description: This legal guardian profile
          x-hal-templates:
            updateLegalGuardian:
              operation: updateLegalGuardian
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

    patch:
      operationId: updateLegalGuardian
      tags: [LegalGuardians]
      summary: Update the profile of a non-member legal guardian
      description: |
        Partial update - only the fields present in the request body are changed. E-mail and telephone
        cannot be cleared. An e-mail that belongs to another legal guardian or to an adult member is
        refused. Requires MEMBERS:MANAGE or being the guardian themself.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      x-klabis-owner-visible: true
      parameters:
        - $ref: '#/components/parameters/LegalGuardianUserIdParam'
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLegalGuardianRequest'
      responses:
        '204':
          description: Legal guardian updated
          content:
            application/prs.hal-forms+json: {}
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

  /api/legal-guardian-options:
    get:
      operationId: listLegalGuardianOptions
      tags: [LegalGuardianOptions]
      summary: List candidates for a legal guardian
      description: |
        Non-member legal guardians and active members aged 18 or more, each person once. The prompt
        is the final display label: members carry their registration number and non-members their
        e-mail so namesakes can be told apart. Requires MEMBERS:MANAGE.
      security:
        - KlabisAuth: [MEMBERS]
      x-klabis-authority: MEMBERS_MANAGE
      parameters:
        - name: kind
          in: query
          description: Restricts the candidates to members or to non-member legal guardians; both when absent
          required: false
          schema:
            $ref: '#/components/schemas/LegalGuardianKind'
      responses:
        '200':
          description: Candidates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalGuardianOptionResponse'
            application/prs.hal-forms+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalGuardianOptionResponse'
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared/responses.yaml#/components/responses/NotFound'
        '409':
          $ref: './_shared/responses.yaml#/components/responses/Conflict'
        '422':
          $ref: './_shared/responses.yaml#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    KlabisAuth:
      type: oauth2
      description: OAuth2 authentication with Klabis Authorization Server
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: authenticate
            profile: display user profile information
            MEMBERS: Members
            EVENTS: Events
            SYNC: Synchronisation

  parameters:
    MemberIdParam:
      name: id
      in: path
      description: Member UUID
      required: true
      # Identifies the target member. Inert on its own: @TargetId is only consulted for a method
      # marked @OwnerVisible or guarded by an authority held over specific targets, so the
      # operations here that do neither are unaffected.
      x-klabis-target-id: MEMBER
      schema:
        type: string
        format: uuid

    SortParam:
      name: sort
      in: query
      description: |
        Sorting criteria in the format: property,(asc|desc). Allowed fields: firstName, lastName,
        registrationNumber.
      required: false
      schema:
        type: array
        default: [lastName,ASC, firstName,ASC]
        items:
          type: string

    LegalGuardianGroupIdParam:
      name: id
      in: path
      required: true
      description: Legal guardian group UUID
      schema:
        type: string
        format: uuid

    LegalGuardianUserIdParam:
      name: userId
      in: path
      required: true
      description: User UUID of the non-member legal guardian
      x-klabis-target-id: MEMBER
      schema:
        type: string
        format: uuid

  schemas:

    # --- Responses ---------------------------------------------------------

    MemberDetailsResponse:
      type: object
      description: |
        Detailed member representation. Fields carrying x-klabis-authority are omitted for callers
        without that authority; x-klabis-owner-visible additionally grants access to the member
        themselves.
      properties:
        id:
          type: string
          format: uuid
          x-klabis-target-id: MEMBER
        registrationNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        nationality:
          type: string
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        gender:
          $ref: '#/components/schemas/Gender'
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        email:
          type: string
        phone:
          type: string
        address:
          $ref: '#/components/schemas/AddressResponse'
        active:
          type: boolean
          x-klabis-authority: MEMBERS_MANAGE
          description: Whether the member is active (visible to admins only)
        chipNumber:
          type: string
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        identityCard:
          $ref: '#/components/schemas/IdentityCardDto'
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        medicalCourse:
          $ref: '#/components/schemas/MedicalCourseDto'
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        trainerLicense:
          $ref: '#/components/schemas/TrainerLicenseDto'
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        refereeLicense:
          $ref: '#/components/schemas/RefereeLicenseDto'
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        drivingLicenseGroup:
          $ref: '#/components/schemas/DrivingLicenseGroup'
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        dietaryRestrictions:
          type: string
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        birthNumber:
          type: string
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        bankAccountNumber:
          type: string
          x-klabis-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-klabis-owner-visible: true
        suspensionReason:
          $ref: '#/components/schemas/DeactivationReason'
          x-klabis-authority: MEMBERS_MANAGE
        suspendedAt:
          type: string
          format: date-time
          x-klabis-authority: MEMBERS_MANAGE
        suspendedBy:
          type: string
          x-klabis-authority: MEMBERS_MANAGE
        suspensionNote:
          type: string
          x-klabis-authority: MEMBERS_MANAGE
        missingData:
          type: array
          items:
            $ref: '#/components/schemas/MissingDataItem'
          x-klabis-authority: MEMBERS_MANAGE
          description: Required details this member currently lacks (visible to admins only)

    MissingDataItem:
      type: string
      description: A detail Klabis requires of a complete member that this member currently lacks.
      enum: [EMAIL, PHONE, BIRTH_NUMBER, GUARDIAN, ADDRESS]

    MemberSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique member identifier (UUID)
          example: 123e4567-e89b-12d3-a456-426614174000
        firstName:
          type: string
          description: Member's first name
          example: Jan
        lastName:
          type: string
          description: Member's last name
          example: Novák
        registrationNumber:
          type: string
          description: Member's unique registration number
          example: ZBM0501
        email:
          type: string
          x-klabis-authority: MEMBERS_MANAGE
          description: Member's email address (visible to admins only)
        active:
          type: boolean
          x-klabis-authority: MEMBERS_MANAGE
          description: Whether the member is active (visible to admins only)
        dataIncomplete:
          type: boolean
          x-klabis-authority: MEMBERS_MANAGE
          description: Whether the member is missing required data (visible to admins only)

    MemberOptionResponse:
      type: object
      description: Member option for select components
      properties:
        value:
          type: string
          description: Member UUID
          example: 123e4567-e89b-12d3-a456-426614174000
        prompt:
          type: string
          description: Display name with registration number
          example: Jan Novák (ZBM0001)

    # --- Requests ----------------------------------------------------------

    RegisterMemberRequest:
      type: object
      description: |
        Member registration request. Whether the member is a minor is derived from dateOfBirth.

        An adult must give their own email and phone and no legalGuardians; an adult may take over
        an existing non-member legal guardian by legalGuardianUserId. A minor needs at least one
        entry in legalGuardians (existing by userId or a new guardian) and their own email and phone
        are optional when a guardian provides them.
      required: [firstName, lastName, dateOfBirth, nationality, gender, address]
      properties:
        firstName:
          type: string
          x-klabis-not-blank: true
          description: Member's first name
          example: Jan
          maxLength: 100
        lastName:
          type: string
          x-klabis-not-blank: true
          description: Member's last name
          example: Novák
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
          description: Member's date of birth
          example: '2005-05-15'
          # No domain guard for this one — Member does not re-check it, so the constraint has to
          # survive on the DTO.
          x-klabis-past: true
        nationality:
          type: string
          x-klabis-not-blank: true
          description: Nationality (ISO 3166-1 alpha-2 code)
          example: CZ
          minLength: 2
          maxLength: 2
        gender:
          $ref: '#/components/schemas/Gender'
          x-hal-input-type: Gender
        email:
          type: string
          format: email
          description: Email address; required for an adult
          example: jan.novak@example.com
          maxLength: 255
        phone:
          type: string
          description: Phone number in E.164 format; required for an adult
          example: '+420777123456'
          pattern: '^\+[0-9\s]{7,20}$'
        address:
          $ref: '#/components/schemas/AddressRequest'
        birthNumber:
          type: string
          description: Birth number (rodné číslo) — Czech nationals only, format RRMMDD/XXXX or RRMMDDXXXX
          example: 900101/1234
        bankAccountNumber:
          type: string
          description: Bank account number (IBAN or domestic Czech format)
          example: CZ6508000000192000145399
          maxLength: 50
        legalGuardians:
          type: array
          description: Legal guardians of a minor; must be empty for an adult
          items:
            $ref: '#/components/schemas/LegalGuardianInputRequest'
        legalGuardianUserId:
          type: string
          format: uuid
          description: Existing non-member legal guardian to take over as the new adult member (keeps their user account)
          x-hal-input-type: UserId

    UpdateMemberRequest:
      type: object
      description: |
        Partial update request. An absent property is left untouched, whereas an explicitly null
        value clears the field — where the underlying field is optional.

        Clearing a field the domain requires is rejected. firstName, lastName, dateOfBirth and
        gender have no cleared state, so a null there is treated as "leave alone". An explicit null
        is refused for email or phone unless a legal guardian of a minor still covers that contact, and
        for birthNumber when the member is a Czech national. Legal guardians are not part of this
        request; they are set through setMemberLegalGuardians.
      # Properties are inlined rather than sharing named wrapper schemas: seven of them are plain
      # strings with different constraints (email 255, chipNumber 50 + digits, firstName 100), and a
      # shared schema can only carry one set.
      properties:
        email:
          type: ['string', 'null']
          maxLength: 255
        phone:
          type: ['string', 'null']
          maxLength: 50
        address:
          $ref: '#/components/schemas/AddressRequest'
          x-klabis-nullable: true
        firstName:
          type: ['string', 'null']
          maxLength: 100
          x-klabis-not-blank: true
          x-klabis-authority: MEMBERS_MANAGE
          x-klabis-read-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
        lastName:
          type: ['string', 'null']
          maxLength: 100
          x-klabis-not-blank: true
          x-klabis-authority: MEMBERS_MANAGE
          x-klabis-read-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
        dateOfBirth:
          type: ['string', 'null']
          format: date
          x-klabis-authority: MEMBERS_MANAGE
          x-klabis-read-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
        # gender re-declares the Gender enum inline instead of $ref-ing it. Both composition
        # keywords are unusable here: oneOf/allOf strip property-level vendor extensions, and an
        # allOf that keeps x-klabis-authority still generates a bare `Gender`, not
        # `JsonNullable<Gender>` — and RequestBodyFieldAuthorizationAdvice skips every component
        # that is not JsonNullable, so the @HasAuthority it emits is never evaluated. Inlining is
        # what keeps the wrapper and the extension at the same time.
        # A null is accepted on the wire and treated as "leave alone" (PersonalInformation rejects
        # a null gender); the wrapper is here for the authorization check, not to clear the field.
        gender:
          type: ['string', 'null']
          enum: ['MALE', 'FEMALE', null]
          x-klabis-authority: MEMBERS_MANAGE
          x-klabis-read-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
          x-hal-input-type: Gender
        chipNumber:
          type: ['string', 'null']
          maxLength: 50
          pattern: '^[0-9]+$'
        nationality:
          type: ['string', 'null']
          minLength: 2
          maxLength: 2
        identityCard:
          $ref: '#/components/schemas/IdentityCardDto'
          x-klabis-nullable: true
        medicalCourse:
          $ref: '#/components/schemas/MedicalCourseDto'
          x-klabis-nullable: true
        trainerLicense:
          $ref: '#/components/schemas/TrainerLicenseDto'
          x-klabis-nullable: true
        refereeLicense:
          $ref: '#/components/schemas/RefereeLicenseDto'
          x-klabis-nullable: true
        drivingLicenseGroup:
          $ref: '#/components/schemas/DrivingLicenseGroup'
          x-klabis-nullable: true
          x-hal-input-type: DrivingLicenseGroup
        dietaryRestrictions:
          type: ['string', 'null']
          maxLength: 500
        birthNumber:
          type: ['string', 'null']
          x-klabis-authority: MEMBERS_MANAGE
          x-klabis-read-authority: [MEMBERS_MANAGE, MEMBERS_EDIT_PROFILE]
        bankAccountNumber:
          type: ['string', 'null']
          maxLength: 50

    SuspendMembershipRequest:
      type: object
      description: Suspension request
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/DeactivationReason'
          x-hal-input-type: DeactivationReason
        note:
          type: string
          maxLength: 500

    # The 409 body of suspendMember. Both blockers are independent (a member can simultaneously
    # owe money AND be a group's last owner), so this is a plain object carrying each as an
    # optional attribute rather than a oneOf — a oneOf can only ever report one blocker at a time,
    # forcing the caller to fix issues one round-trip at a time.
    SuspensionBlockedWarning:
      type: object
      description: |
        Suspension is blocked by one or both independent reasons. Both `debt` and `groups` are
        checked and reported together, not exclusively.
      properties:
        debt:
          $ref: '#/components/schemas/OutstandingDebtWarning'
        groups:
          $ref: '#/components/schemas/LastOwnerWarning'

    OutstandingDebtWarning:
      type: object
      description: The member owes money — settle the account before suspending them.
      required: [balance, accountLink]
      properties:
        balance:
          $ref: '#/components/schemas/MonetaryAmount'
        accountLink:
          type: string
          format: uri
          description: Absolute URL of the member's finance account

    LastOwnerWarning:
      type: object
      description: |
        The member is the sole owner of the listed groups. Each one needs another owner (or must be
        dissolved) before the suspension can go through.
      required: [message, affectedGroups]
      properties:
        message:
          type: string
        affectedGroups:
          type: array
          items:
            $ref: '#/components/schemas/AffectedGroup'

    AffectedGroup:
      type: object
      required: [groupId, groupName, groupType]
      properties:
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        groupType:
          type: string
          enum: [FREE, LEGAL_GUARDIAN, TRAINING]
          description: Which of the three group aggregates the member owns

    MonetaryAmount:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          description: Negative when the member is in debt
        currency:
          type: string
          description: ISO 4217 code

    # --- Shared value objects ----------------------------------------------

    AddressResponse:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string

    AddressRequest:
      type: object
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          x-klabis-not-blank: true
          maxLength: 200
        city:
          type: string
          x-klabis-not-blank: true
          maxLength: 100
        postalCode:
          type: string
          x-klabis-not-blank: true
          description: Alphanumeric, hyphens and spaces allowed
          maxLength: 20
          # Kept in sync with Address.POSTAL_CODE_PATTERN, which the aggregate enforces too.
          pattern: '^[A-Za-z0-9][A-Za-z0-9 -]*[A-Za-z0-9]$|^[A-Za-z0-9]$'
        country:
          type: string
          x-klabis-not-blank: true
          description: ISO 3166-1 alpha-2 code
          # Kept in sync with Address.ISO_3166_ALPHA_2_PATTERN.
          pattern: '^[A-Za-z]{2}$'

    IdentityCardDto:
      type: object
      properties:
        cardNumber:
          type: string
          maxLength: 50
        validityDate:
          type: string
          format: date

    MedicalCourseDto:
      type: object
      properties:
        completionDate:
          type: string
          format: date
        validityDate:
          type: string
          format: date

    TrainerLicenseDto:
      type: object
      properties:
        level:
          type: string
          enum: [T1, T2, T3]
        validityDate:
          type: string
          format: date

    RefereeLicenseDto:
      type: object
      properties:
        level:
          type: string
          enum: [R1, R2, R3]
        validityDate:
          type: string
          format: date

    Gender:
      type: string
      enum: [MALE, FEMALE]

    DeactivationReason:
      type: string
      enum: [ODHLASKA, PRESTUP, OTHER]

    DrivingLicenseGroup:
      type: string
      enum: [AM, A1, A2, A, B, BE, C, C1, D, D1, T]

    # === LegalGuardianGroups ============================================================================

    SetLegalGuardiansRequest:
      type: object
      description: Complete list of legal guardians. Must not be empty.
      required: [legalGuardians]
      properties:
        legalGuardians:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LegalGuardianInputRequest'

    LegalGuardianInputRequest:
      type: object
      description: |
        A legal guardian: either an existing one chosen by userId, or a new non-member guardian given by
        firstName, lastName, e-mail and phone (all four required, checked by the server).
      properties:
        userId:
          type: string
          format: uuid
          description: UUID of an existing guardian user
          x-hal-input-type: UserId
        firstName:
          type: string
          maxLength: 100
          description: First name of a new guardian
        lastName:
          type: string
          maxLength: 100
          description: Last name of a new guardian
        email:
          type: string
          maxLength: 255
          description: E-mail of a new guardian
        phone:
          type: string
          maxLength: 50
          description: Telephone of a new guardian

    LegalGuardianGroupSummaryResponse:
      type: object
      x-klabis-relation:
        collectionRelation: legalGuardianGroupSummaryResponseList
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/LegalGuardianGroupSummaryGuardian'
        minorCount:
          type: integer
          format: int32

    LegalGuardianGroupSummaryGuardian:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    # guardians/minors are arrays of HAL-wrapped items (each carrying its own _links at runtime), so
    # the Java record fields resolve to List<EntityModel<X>>. See x-hal-entity-items in the
    # klabis-api-spec skill.
    LegalGuardianGroupResponse:
      type: object
      description: Legal guardian group detail with its minors as independently linked items.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        minors:
          type: array
          x-hal-entity-items: true
          items:
            $ref: '#/components/schemas/LegalGuardianGroupMinorResponse'

    LegalGuardianGroupGuardianResponse:
      type: object
      x-klabis-relation:
        collectionRelation: legalGuardianGroupGuardianResponseList
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string

    LegalGuardianGroupMinorResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        registrationNumber:
          type: string
        joinedAt:
          type: string
          format: date-time

    # === LegalGuardians =================================================================================

    LegalGuardianResponse:
      type: object
      description: Profile of a non-member legal guardian.
      required: [userId, loginName, firstName, lastName, email, phone]
      properties:
        userId:
          type: string
          format: uuid
          x-klabis-target-id: MEMBER
        loginName:
          type: string
          description: Login number of the guardian (EXTnnnn)
          example: EXT0001
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string

    UpdateLegalGuardianRequest:
      type: object
      description: |
        Partial update of names; e-mail and telephone are required and always sent, and a null or blank
        value is refused with 400.
      required: [email, phone]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          minLength: 1
          maxLength: 255
          x-klabis-not-blank: true
        phone:
          type: string
          minLength: 1
          maxLength: 50
          x-klabis-not-blank: true

    LegalGuardianKind:
      type: string
      enum: [MEMBER, LEGAL_GUARDIAN]

    LegalGuardianOptionResponse:
      type: object
      description: |
        Candidate for a legal guardian. value/prompt make it usable as remote HAL-FORMS options.
      properties:
        value:
          type: string
          description: User UUID of the candidate
        prompt:
          type: string
