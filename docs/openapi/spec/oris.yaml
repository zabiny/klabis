# ORIS module — the API surface of OrisController. Plain JSON (application/json), not HAL+FORMS:
# the controller's class-level @RequestMapping declares produces = MediaType.APPLICATION_JSON_VALUE
# and returns a bare list, not an EntityModel/CollectionModel.
#
# Tag is "OrisImport", not "ORIS": the generator's `apis` global property matches tags by
# substring, not exact name, and events.yaml already owns a tag "OrisEvents" — "ORIS" alone would
# have matched both and pulled OrisEventsApi's operations into this module's generated interface
# instead of (or alongside) this module's own. See klabis-api-spec skill and the events.yaml
# OrisEvents section.

# Standalone OpenAPI document: this file renders on its own in Swagger UI / Redoc, served
# from this directory so its ./_shared/*.yaml refs resolve. info is duplicated from
# klabis.yaml rather than shared, because $ref cannot target a document's own info; the
# bundler ignores both keys (modules are pulled in by #/paths/... pointer, never whole-file)
# and validate.mjs pins version to the root's so the two cannot drift.
openapi: 3.1.0

info:
  title: Klabis API — ORIS integration module
  description: The ORIS integration slice of the Klabis API. See klabis.yaml for the full API.
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: Local development server
  - url: https://api.klabis.com
    description: Production server

paths:

  /api/oris/events:
    get:
      operationId: listOrisEvents
      # Passthrough of an external ORIS listing; these are not Klabis resources.
      x-klabis-hal: false
      tags: [OrisImport]
      summary: List upcoming ORIS events
      description: |
        Returns events from ORIS available for import. Accepts multiple region parameters (ORIS
        region enum names) to combine results. Already-imported events are filtered out.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      parameters:
        - name: region
          in: query
          description: ORIS region codes to query. Defaults to JIHOMORAVSKA when omitted.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: List of ORIS events available for import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrisEventSummary'
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'

  /api/oris/club-key:
    get:
      operationId: getClubKeyState
      tags: [OrisClubKey]
      summary: Whether the ORIS club key is held
      description: |
        Reports only whether a club key is currently held — never the key itself, not even
        partially masked. The response carries exactly one affordance: 'set' while no key is
        held, 'clear' while one is (design.md D10) — a client never has to decide which action
        applies.
      security:
        - KlabisAuth: [SYNC]
      x-klabis-authority: SYNC_MANAGE
      responses:
        '200':
          description: Club key state returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubKeyStateResponse'
          x-hal-links:
            self:
              description: This club key state
          x-hal-templates:
            setClubKey:
              operation: setClubKey
              description: Present only while no club key is held
            clearClubKey:
              operation: clearClubKey
              description: Present only while a club key is held
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'

    put:
      operationId: setClubKey
      tags: [OrisClubKey]
      summary: Supply the ORIS club key
      description: |
        Supplies the club key used to read the club's membership list from ORIS. Replaces any
        previously held key. The value is never shown back, at any point. A blank value is
        refused — discarding a key is a deliberate DELETE instead (design.md D10).
      security:
        - KlabisAuth: [SYNC]
      x-klabis-authority: SYNC_MANAGE
      requestBody:
        required: true
        x-codegen-request-body-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetClubKeyRequest'
      responses:
        '200':
          description: Club key stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubKeyStateResponse'
          x-hal-links:
            self:
              description: This club key state
          x-hal-templates:
            setClubKey:
              operation: setClubKey
              description: Present only while no club key is held
            clearClubKey:
              operation: clearClubKey
              description: Present only while a club key is held
        '400':
          $ref: './_shared/responses.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'

    delete:
      operationId: clearClubKey
      tags: [OrisClubKey]
      summary: Discard the held ORIS club key
      description: |
        Discards the held club key, leaving the system as though none had ever been supplied.
        Work needing the key stops until a new one is supplied. Discarding while no key is held
        succeeds without error (design.md D10, spec scenario "Discarding when no key is held").
      security:
        - KlabisAuth: [SYNC]
      x-klabis-authority: SYNC_MANAGE
      responses:
        '204':
          description: Club key discarded (or none was held)
          content:
            application/prs.hal-forms+json: {}
        '401':
          $ref: './_shared/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared/responses.yaml#/components/responses/Forbidden'

components:
  securitySchemes:
    KlabisAuth:
      type: oauth2
      description: OAuth2 authentication with Klabis Authorization Server
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: authenticate
            profile: display user profile information
            MEMBERS: Members
            EVENTS: Events
            SYNC: Synchronisation

  schemas:

    OrisEventSummary:
      type: object
      description: A single ORIS event available for import.
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        date:
          type: string
          format: date
        location:
          type: string
        organizer:
          type: string

    ClubKeyStateResponse:
      type: object
      description: Whether the ORIS club key is currently held. Never carries the key itself.
      required: [isSet]
      properties:
        isSet:
          type: boolean

    SetClubKeyRequest:
      type: object
      description: Supplies the ORIS club key. A blank value is refused.
      required: [clubKey]
      properties:
        clubKey:
          type: string
          x-klabis-not-blank: true
