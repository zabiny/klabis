# ORIS module — the API surface of OrisController. Plain JSON (application/json), not HAL+FORMS:
# the controller's class-level @RequestMapping declares produces = MediaType.APPLICATION_JSON_VALUE
# and returns a bare list, not an EntityModel/CollectionModel.
#
# Tag is "OrisImport", not "ORIS": the generator's `apis` global property matches tags by
# substring, not exact name, and events.yaml already owns a tag "OrisEvents" — "ORIS" alone would
# have matched both and pulled OrisEventsApi's operations into this module's generated interface
# instead of (or alongside) this module's own. See klabis-api-spec skill and the events.yaml
# OrisEvents section.

paths:

  /api/oris/events:
    get:
      operationId: listOrisEvents
      tags: [OrisImport]
      summary: List upcoming ORIS events
      description: |
        Returns events from ORIS available for import. Accepts multiple region parameters (ORIS
        region enum names) to combine results. Already-imported events are filtered out.
      security:
        - KlabisAuth: [EVENTS]
      x-klabis-authority: EVENTS_MANAGE
      parameters:
        - name: region
          in: query
          description: ORIS region codes to query. Defaults to JIHOMORAVSKA when omitted.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: List of ORIS events available for import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrisEventSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  responses:
    BadRequest:
      description: Bad request - invalid argument
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: './_shared/problem.yaml#/components/schemas/ProblemDetail'

  schemas:

    OrisEventSummary:
      type: object
      description: A single ORIS event available for import.
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        date:
          type: string
          format: date
        location:
          type: string
          nullable: true
        organizer:
          type: string
          nullable: true
