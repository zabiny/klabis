spring:
  application:
    name: klabis-backend

  profiles:
    active: h2,ssl,debug,metrics,oris,example-data
    group:
      test: h2,debug,test
      test-bootstrap: example-data

  mvc:
    problemdetails:
      enabled: true

  modulith:
    detection-strategy: explicitly-annotated
    events:
      enabled: true
      completion-mode: UPDATE
      republish-outstanding-events-on-restart: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      authorizationserver:
        issuer: ${KLABIS_OAUTH2_ISSUER:https://localhost:8443}

  devtools:
    livereload:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,prometheus,metrics
      base-path: /actuator
  endpoint:
    modulith:
      access: read_only
    health:
      access: unrestricted
    info:
      access: read_only

resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 5s
    instances:
      password-reset:
        base-config: default
        limit-for-period: 3
        limit-refresh-period: 1h
        timeout-duration: 0s
      password-setup-token-request:
        base-config: default
        limit-for-period: 3
        limit-refresh-period: 1h
        timeout-duration: 0s
  retry:
    instances:
      # Absorbs transient transport blips within one synchronisation attempt
      # (openspec/changes/add-bidirectional-sync-engine/design.md D10). Retries only
      # exceptions the engine itself would classify as retryable or outage-shaped —
      # never a terminal failure, which must surface immediately.
      sync-adapter:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          # An adapter's own explicit "this is retryable" signal (e.g. an HTTP client
          # exception for a 5xx response) — same design.md D10 RETRYABLE category as
          # the two above, so it gets the same in-attempt retry, not just the
          # across-pass backoff.
          - com.klabis.sync.domain.RetryableSyncFailureException
  circuitbreaker:
    instances:
      # Opens after repeated external-system failures so the rest of a pass's records
      # are left untouched rather than each consuming its retry budget in turn
      # (design.md D11).
      sync-adapter:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

springdoc:
  swagger-ui:
    oauth:
      client-id: apispec
      client-secret: apispec
      scopes: openid,profile
  show-actuator: true
  api-docs:
    groups:
      enabled: true
    enabled: true
  group-configs:
    - group: members
      display-name: Members API
      packages-to-scan:
        - com.klabis.members
        - com.klabis.common.users
    - group: events
      display-name: Events API
      packages-to-scan:
        - com.klabis.events
    - group: finance
      display-name: Finances API
      packages-to-scan:
        - com.klabis.finance
    - group: calendar
      display-name: Calendar API
      packages-to-scan:
        - com.klabis.calendar
    - group: membergroups
      display-name: Member groups API
      packages-to-scan:
        - com.klabis.groups
    - group: membershipfees
      display-name: Membership fees API
      packages-to-scan:
        - com.klabis.membershipfees
    - group: oris
      display-name: ORIS proxy API
      packages-to-scan:
        - com.klabis.oris
    - group: sync
      display-name: Synchronisation API
      packages-to-scan:
        - com.klabis.sync
    - group: all
      display-name: X All endpoints
      paths-to-match:
        - /**
      paths-to-exclude:
        - /actuator/**
    - group: actuator
      display-name: System monitoring endpoints
      paths-to-match:
        - /actuator/**

klabis:
  finance:
    overdraft-limit: ${KLABIS_FINANCE_OVERDRAFT_LIMIT:-500}

  ical:
    base-url: ${KLABIS_BASE_URL:https://localhost:8443}
    window:
      past: ${KLABIS_ICAL_WINDOW_PAST:P30D}
      future: ${KLABIS_ICAL_WINDOW_FUTURE:P12M}

  club:
    code: ${KLABIS_CLUB_CODE:ZBM}
    name: ${KLABIS_CLUB_NAME:Klub orientačního běhu}

  email:
    from: ${KLABIS_EMAIL_FROM:noreply@klabis.cz}

  events:
    logging:
      enabled: ${KLABIS_EVENT_LOGGING_ENABLED:true}

  frontend:
    allowed-origins: ${KLABIS_FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:8443}
    allow-credentials: ${KLABIS_FRONTEND_ALLOW_CREDENTIALS:true}

  bootstrap:
    admin:
      username: ${KLABIS_ADMIN_USERNAME:admin}
      password: ${KLABIS_ADMIN_PASSWORD:}

  sync:
    scan-cron: ${KLABIS_SYNC_SCAN_CRON:0 0 2 * * *}
    due-scan-interval: ${KLABIS_SYNC_DUE_SCAN_INTERVAL:15m}

  oauth2:
    # Profile 'local-dev': activates a second confidential OAuth2 client 'klabis-web-local'
    # with CLIENT_SECRET_POST + PKCE + REFRESH_TOKEN grant. Enables silent token renewal
    # on the Vite dev server (localhost:3000) without the silent-renew iframe workaround.
    # Override the client secret via KLABIS_OAUTH2_LOCAL_CLIENT_SECRET env var.
    # WARNING: never activate this profile in staging or production environments.
    client:
      id: ${KLABIS_OAUTH2_CLIENT_ID:klabis-web}
      secret: ${KLABIS_OAUTH2_CLIENT_SECRET:}
      uuid: ${KLABIS_OAUTH2_CLIENT_UUID:}
      redirect-uris: ${KLABIS_OAUTH2_CLIENT_REDIRECT_URIS:http://localhost:3000/auth/callback,https://localhost:8443/mock/auth/callback.html,https://localhost:8443/auth/callback,http://localhost:3000/silent-renew.html,https://localhost:8443/silent-renew.html}
      post-logout-redirect-uris: ${KLABIS_OAUTH2_POST_LOGOUT_REDIRECT_URIS:http://localhost:3000,https://localhost:8443}
      scopes: ${KLABIS_OAUTH2_CLIENT_SCOPES:}

  password-setup:
    base-url: ${KLABIS_BASE_URL:https://localhost:8443}
    token:
      expiration-hours: ${KLABIS_PASSWORD_SETUP_TOKEN_EXPIRATION_HOURS:4}
      hash-algorithm: SHA-256
    rate-limit:
      requests: 3
      duration-seconds: 3600

oris:
  client:
    enabled: false

jasypt:
  encryptor:
    password: ${KLABIS_JASYPT_PASSWORD}
    algorithm: PBEWithHmacSHA512AndAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

server:
  port: 8080
  ssl:
    enabled: false
  http2:
    enabled: true

info:
  app:
    name: Klabis Backend API
    description: Klabis Membership Management System
    version: 0.1.0-SNAPSHOT

logging:
  level:
    com.klabis: INFO
    org.springframework.web: INFO
    org.springframework.modulith.events: ${KLABIS_EVENT_LOGGING_LEVEL:INFO}


