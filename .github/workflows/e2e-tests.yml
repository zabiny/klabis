name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag of ghcr.io/zabiny/klabis-be to test'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: Playwright E2E against published image
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/zabiny/klabis-be:${{ inputs.image_tag }}
      CONTAINER_NAME: klabis-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker run -d --name "$CONTAINER_NAME" -p 8443:8443 \
            -e SPRING_PROFILES_ACTIVE='h2,ssl,example-data' \
            -e KLABIS_ADMIN_USERNAME='admin' \
            -e KLABIS_ADMIN_PASSWORD='admin123' \
            -e KLABIS_OAUTH2_CLIENT_SECRET='test-secret-123' \
            -e KLABIS_ENCRYPTION_PASSWORD='test-key-123' \
            -e KLABIS_ENCRYPTION_SALT='5c0744940b5c369b' \
            -e KLABIS_VAPID_PUBLIC_KEY='BKkNxEb4uqNdKoGdvxojFevTMSV9ClYRW4qxfBg6pMf7Uz1GSNrRA0GNtoZUMg9i39ntx3-L3gdj8_dOrFuAvKM' \
            -e KLABIS_VAPID_PRIVATE_KEY='8bzK6UJA6gxrdsqY1y_zlMZt2L-sNmsAYnx8VVwEjqM' \
            -e KLABIS_VAPID_SUBJECT='mailto:admin@localhost' \
            "$IMAGE"

      - name: Wait for backend health
        run: |
          timeout=180
          start=$(date +%s)
          until curl -ksf https://localhost:8443/actuator/health; do
            if (( $(date +%s) - start >= timeout )); then
              echo "::error::Backend did not become healthy within ${timeout}s"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            sleep 3
          done
          echo
          echo "Backend healthy after $(( $(date +%s) - start ))s"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost:8443
        run: npm run test:e2e

      - name: Dump backend container log
        if: always()
        run: docker logs "$CONTAINER_NAME" > backend-container.log 2>&1 || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload backend container log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-container-log
          path: backend-container.log
          if-no-files-found: ignore

      - name: Stop backend container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
