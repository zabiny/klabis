# Installed by the agentic-sdlc install skill. Opts an issue in (assigns the agent account) when a Stakeholder or Developer mentions @sdlc.
# Runs the default branch's .github/sdlc/automation.py, never code from a pull request.
name: sdlc-mention
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 .github/sdlc/automation.py mention
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
