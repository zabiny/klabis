name: Publish OpenAPI docs
run-name: ${{ github.actor }} changed API
on:
  workflow_dispatch:
jobs:
  publish-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install openapi-bundle dependencies
        run: npm ci --prefix tools/openapi-bundle

      - name: Bundle OpenAPI spec
        run: node tools/openapi-bundle/bundle.mjs

      - name: Generate Swagger UI
        run: |
          set -euo pipefail
          npm pack swagger-ui-dist@5 --pack-destination "$RUNNER_TEMP"
          mkdir -p swagger-ui
          tar -xzf "$RUNNER_TEMP"/swagger-ui-dist-*.tgz -C swagger-ui --strip-components=1 --wildcards 'package/*.html' 'package/*.css' 'package/*.js' 'package/*.png'
          cp docs/openapi/klabis-full.json swagger-ui/
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|klabis-full.json|' swagger-ui/swagger-initializer.js
          grep -q 'url: "klabis-full.json"' swagger-ui/swagger-initializer.js

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6d3b45135e45036d3f059ce628a4e3f2
          command: pages deploy swagger-ui --project-name=klabis-api-docs
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
