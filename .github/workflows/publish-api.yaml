name: Publish OpenAPI docs
run-name: ${{ github.actor }} changed API
on:
  push:
    branches:
      - main
    paths:
      - 'docs/openapi/spec/**'
jobs:
  publish-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install openapi-bundle dependencies
        run: npm ci --prefix tools/openapi-bundle

      - name: Bundle OpenAPI spec
        run: node tools/openapi-bundle/bundle.mjs

      - name: Generate Swagger UI
        uses: Legion2/swagger-ui-action@v1
        with:
          output: swagger-ui
          spec-file: docs/openapi/klabis-full.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6d3b45135e45036d3f059ce628a4e3f2
          projectName: klabis-api-docs
          directory: swagger-ui
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
