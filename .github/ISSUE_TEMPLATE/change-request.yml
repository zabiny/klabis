name: Change request
description: Ask for a change the SDLC agents can pick up once a Stakeholder or Developer opts it in.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible afterwards, and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How will we know it is done? One observable criterion per line.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, links, constraints, anything the agents should know.
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: The kind of change.
      options:
        - feature
        - bug
        - refactor
        - docs
        - chore
    validations:
      required: true
